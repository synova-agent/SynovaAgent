writeset:
  - .claude/claims/1049.yaml
  - scripts/control-tower/check-merge-conditions.sh
  - scripts/control-tower/check-quality-delta.py
  - .gitea/workflows/local-gates.yml
  - tests/control-tower/check-merge-conditions.test.sh
  - tests/control-tower/check-quality-delta.test.sh
done:
  - verify: grep -q "E_OPENPRS_EMPTY" scripts/control-tower/check-merge-conditions.sh
  - verify: grep -q "E_COV_UNARMED" scripts/control-tower/check-quality-delta.py
  - verify: grep -q "coverage-required" .gitea/workflows/local-gates.yml
  - verify: test $(bash tests/control-tower/check-quality-delta.test.sh >/dev/null 2>&1; echo $?) -eq 0
note: "#1049 裁422-R2（A类已批政策实现）：判不了必须 exit 2——merge-conditions cond2 对手集断言（D-10 fail-open 堵死）＋quality-delta --coverage-required（①e 摘要缺失⇒E_COV_UNARMED）＋local-gates ①e else 分支。SYNO_QD_G5=0 回滚语义保持"
