note: "#1311：新增正式可加载编码预设 docs/synova/presets/synova-coding/。声明 dsh.bundle.patch 后即被安装器与校验器自动发现（无需改注册表）。人格块含开工必读 6 项、任务 SOP 0-10、纪律红线、技能路由；引用的 9 个 skill 与 5 条 SOP 命令经死链自检全部存在。dsh-preset-draft 标注已被取代。实测：--repo 发现预设 2->3 且 REPO-OK；install --check 0 漂移；--consistency 逐字节一致（12016 字节）。拆分说明：AGENTS.md 指针与 .synova/.dsh 双轨 dsh-code-standards 锚点校准属第二批，被 .claude/claims/1227.yaml 认领挡下（D-C 对账判 #1311 与 claim #1227 不一致），不在本件内。"
