# .claude/claims/1319.yaml — T3 旧门触发退役
writeset:
  - .gitea/workflows/local-gates.yml
  - .claude/claims/1319.yaml
  - gate-exemptions/2026-11-09-1319-g2-old-trigger-retire.md
  - docs/authority/DOCS-REGISTRY.yaml
done:
  - verify: python3 -c "import yaml;w=yaml.load(open('.gitea/workflows/local-gates.yml',encoding='utf-8'),Loader=yaml.BaseLoader);assert w.get('on')=='workflow_dispatch',w.get('on')"
  - verify: python3 scripts/control-tower/claim_store.py --check 1319
  - verify: bash scripts/control-tower/check-gate-protection.sh --changed-base gitea/main
  - verify: git diff --cached --check
  - verify: git diff --name-only gitea/main...HEAD
note: "#1319 T3：旧 local-gates 仅保留 workflow_dispatch，PR/push 不再自动运行；core-gates / core (pull_request_target) 继续作为唯一必需 context，新门日志、判据与 GitHub 运行面均不变。保留旧步骤与手动入口，不清理历史文件。"
