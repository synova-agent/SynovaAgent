note: 【预算瘦身（CTO 裁 a）】延后 2 项（cash-flow-sentinel.ts / cpc-sentinel.ts 的非承重改动）已登记进 PR 未解决项；2 组测试合并（用例数守恒 17）。cron 扇出 = 全局轮不变 + per-org 只写轮（executeForActiveOrgs；无 active org ⇒ 不跑不写）；discoverTeams 改读 orgs（V6=修）；覆盖面 = 行级租户正确 + 零交叉；数值级隔离未接（各 org 取值目前相同 ⇒ 另立卡 p1）。
