writeset:
  - .claude/claims/1414.yaml
  - .gitea/workflows/core-gates.yml
done:
  - verify: python3 scripts/control-tower/claim_store.py --check 1414 --root .
  - verify: python3 -c 'import yaml,sys; cg=yaml.safe_load(open(".gitea/workflows/core-gates.yml",encoding="utf-8"))["concurrency"]; ds=yaml.safe_load(open(".gitea/workflows/dual-repo-sync.yml",encoding="utf-8"))["concurrency"]; e1="${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"; e2="${{ github.workflow }}-${{ github.ref }}"; ok=cg=={"group":e1,"cancel-in-progress":True} and ds=={"group":e2,"cancel-in-progress":True}; print("concurrency-ok:",ok); sys.exit(0 if ok else 1)'
  - verify: CI=1 SYNO_CI=1 bash tests/control-tower/core-gates-workflow.test.sh
  - verify: git diff --check HEAD~1
note: "Issue #1414 回归修复：core-gates.yml concurrency.group 改为 ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}（dual-repo-sync 无 PR 事件，保持 ${{ github.workflow }}-${{ github.ref }} 不变）。回归证据：合并后 run 4331(workflow_dispatch main, created 03:56:45) 在 run 4332(pull_request_target PR#1412, created 04:00:13) 创建后 9 秒（04:00:22）被取消 ⇒ pull_request_target 下 github.ref=refs/heads/main 使 PR/main 同组互杀。临时 probe 分支验证（PR #1418 指向 probe-1414b-base，验证完关闭并删分支）：① 同 PR 连续两次 push：run 4336(created 04:32:30) 在 run 4338(created 04:34:20) 创建后被 cancelled（4336 completed_at=04:34:25）；② PR run 4338 在 dispatch run 4339(created 04:36:39, ref=refs/heads/probe-1414b-base) 创建后未被取消、04:41:02→04:48:04 跑完 success；4338 日志 PROBE-PR-NUMBER=1418 / PROBE-GROUP=zz-1414b-group-probe-1418，4339 日志 PROBE-PR-NUMBER=（空）/ PROBE-GROUP=zz-1414b-group-probe-refs/heads/probe-1414b-base ⇒ 两组不同、不互杀。受信核心输入变更，不自行合并，走受控合并。"
