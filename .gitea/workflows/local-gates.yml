# 本机门禁 · 极简版（Gitea Actions · host 模式 · 无外部 action 依赖）
#
# 🔴 设计原则（2026-10-10 创始人明令：不得重犯"CI 又多又复杂 ⇒ 超时 ⇒ --no-verify"的历史病根）
#   ① **少**：只留 3 步，且每步对应一条真会被绕过的风险
#   ② **快**：目标 < 5 分钟；测试用 --changed（只测改动的），不跑全量
#   ③ **可解释**：任何一步红了，一句话说清"哪里错、怎么修"；**存量问题只告警不阻断**
#   ④ 硬上限：单作业 15 分钟（超出视为 CI 故障，不是代码问题）
name: local-gates
on:
  push:
  pull_request:
    branches: [ main, local-main ]
  workflow_dispatch:
jobs:
  gates:
    runs-on: macos
    timeout-minutes: 15
    steps:
      - name: 工作区（本机 Gitea 克隆；不用 actions/checkout）
        run: |
          set -e
          WS=/Users/wane/.ci-work/SynovaAgent
          if [ ! -d "$WS/.git" ]; then mkdir -p "$(dirname "$WS")"; git clone -q http://127.0.0.1:3000/synova-agent/SynovaAgent.git "$WS"; fi
          git -C "$WS" fetch -q origin || true
          git -C "$WS" checkout -q -f "${{ github.sha }}" 2>/dev/null || git -C "$WS" checkout -q -f FETCH_HEAD
          echo "HEAD=$(git -C "$WS" rev-parse --short HEAD)"
      - name: 依赖（lock 哈希指纹：变了就重装，没变才跳过）
        run: |
          set -e
          WS=/Users/wane/.ci-work/SynovaAgent
          NODE_BIN=/Users/wane/.nvm/versions/node/v24.19.0/bin
          # 🔴 2026-10-11 创始人裁定①：原判据 `if [ -d "$WS/node_modules/vitest" ]` 只看"装过没有"，
          #   与 `package-lock.json` 无关 ⇒ **依赖变更在 CI 里不生效**（安全修复也一样）。
          #   实证：CI 工作区 node_modules/react 停在 19.3.0（mtime Oct 10 16:48），
          #         而 #337 的 lock 已是 18.3.1；日志打印「依赖已存在」⇒ 该 PR 的 CI 从未跑过 npm ci，
          #         红是"旧树"所致，不是分支内容所致。
          #   修法：以 lock 文件内容哈希作**缓存指纹** —— 指纹变了 ⇒ 强制重装。
          #   ⚠️ 只改"何时装"，不改"装什么"（仍是 `npm ci`，即严格按 lock 装）。
          HASH_FILE="$WS/.deps-lock-hash"
          CUR_HASH="$(shasum -a 256 "$WS/package-lock.json" 2>/dev/null | awk '{print $1}')"
          PREV_HASH="$(cat "$HASH_FILE" 2>/dev/null || true)"
          echo "lock 哈希 = ${CUR_HASH:-<无法计算>}（上次 ${PREV_HASH:-<无>}）"
          if [ ! -d "$WS/node_modules/vitest" ]; then
            echo "⇒ node_modules 缺失/vitest 不在 ⇒ npm ci"
          elif [ -z "$CUR_HASH" ]; then
            echo "⇒ lock 哈希不可计算（fail-closed）⇒ npm ci"
          elif [ "$CUR_HASH" = "$PREV_HASH" ]; then
            echo "⇒ lock 未变，依赖已存在，跳过 npm ci"
            exit 0
          else
            echo "⇒ lock 已变更 ⇒ 重装（这正是让依赖变更在 CI 生效的那一步）"
          fi
          cd "$WS"
          /usr/bin/env PATH="$NODE_BIN:$PATH" npm ci --silent
          printf '%s\n' "$CUR_HASH" > "$HASH_FILE"
          echo "已重装并更新指纹 ⇒ $HASH_FILE"
      - name: ① 13 组门禁（唯一的阻断门）
        run: |
          cd /Users/wane/.ci-work/SynovaAgent
          # 🔴 CTO 2026-10-11 裁定③：**本地 CI 不判 D734**（显式跳过，非静默）
          #   理由：Gitea host 模式下事件分流表达式不可靠（`${{ github.event_name }}` 实测不生效），
          #         而 D734 是"PR 预算"，对着集成分支账本总额判必然恒红 ⇒ 红灯失去信息量。
          #   执法位置改回：① 本地提交时软提示 ② 开 PR 时由审查人/CTO 人工判（13 组其余照常）
          export SYNO_SKIP_PR_BUDGET=1
          # 登记件不变量（CTO 2026-10-11 立：机器真源零约束曾致 id 撞号 + 误改他项）
          node_modules/.bin/tsx scripts/control-tower/check-registry-invariants.ts || exit 1
          # 块级 paths 快照对账（CTO 裁定 074 步 1b；治理线交付）——
          #   治「快照漂移」：真源 `ConstructionBlock.paths` 是手工写死的并集，施工项一变就过时
          #   （实证 2026-10-13：K10 少 4 条 / K12 多 2 条，根因=生成时读到旧真源）。
          #   🔴 三态必须**原样透传**：0=一致 ｜ 1=不一致 ｜ **2=判不了（fail-closed）**
          #   ⇒ 用 `|| exit $?` 保留原码，**禁** `|| exit 1`（那会把 2 说成 1，红因失真）
          #     ——同族教训：本文件「④ 门禁复现器自检」步已写明"`|| exit $?` 保留原 rc（harness=2）"。
          #   🔴 **不动任何 job `name:`**（12 必需 context 的唯一产出者）
          PATH="/Users/wane/.nvm/versions/node/v24.19.0/bin:$PATH" bash scripts/control-tower/check-block-paths.sh || exit $?
          PATH="/Users/wane/.nvm/versions/node/v24.19.0/bin:$PATH" SYNO_CI=1 bash scripts/pre-commit-check.sh
      - name: ①b 看板真值（交付未回填检测 · CTO 2026-10-11 立）
        run: |
          cd /Users/wane/.ci-work/SynovaAgent
          # 治「交付未回填」致看板失真：已合并 PR 的交付性引用所指 issue 仍 open ⇒ 红
          # 判别力自检：含交付性引用的 PR 数 == 0 ⇒ exit 2（禁把"看不见"当"没问题"）
          export GITEA_TOKEN="$(cat /Users/wane/gitea/.win-push-token 2>/dev/null || true)"
          PATH="/Users/wane/.nvm/versions/node/v24.19.0/bin:$PATH" \
            node_modules/.bin/tsx scripts/control-tower/check-board-truth.ts || exit 1
      - name: ①c 内容面耦合 CC1–CC4（K12-13/#196 · 存量棘轮／新增必拦）
        run: |
          cd /Users/wane/.ci-work/SynovaAgent
          # 判据源: 院方《extensions内容面规范-v0.1》§3.5；既有 check-architecture.sh 对 extensions/ 零覆盖。
          # 语义（门禁自带，不在此另造）: 存量 237 条登记在门禁 `CC-BASELINE` 段 ⇒ 只报数不判红；
          #   基线外新增 ⇒ exit 1。**不加 CC_STRICT**（加 = 把存量也判红，违反「存量只告警」）。
          # 🔴 **必须注入 SYNO_CI=1**（独立复核 2026-10-12 实测出的阻塞项，本行即其修法）：
          #   门禁的 CI 硬阻断位是**自己实现的**（`check-content-coupling.sh:101` MODE 由 SYNO_CI 推导），
          #   而 **local 模式对新增显式 `return 0`**（契约就是只报数、不判红）。
          #   ⇒ 不注入 SYNO_CI ⇒ 该步**任何新增都 rc=0 ⇒ 永不红**（名实不符 + 零防守力）。
          #   实测（本卡原始输出）：造一条真实新增 ⇒ 无 SYNO_CI rc=**0**／有 SYNO_CI rc=**1**。
          #   （我此前在门禁 §接入方案 写的「`|| exit 1` 已保证该步红」是**错的** —— 已一并更正。）
          # 与步骤「① 13 组门禁」的关系：① 步以 SYNO_CI=1 跑 pre-commit-check.sh，其附加块已含本门禁
          #   ⇒ 功能上早已覆盖；本步的价值是**可具名定位**（红时一眼看到是哪条），并在 ① 被绕过时能补位
          #   （补位能力正是靠上面这个 SYNO_CI=1 —— 没有它，本步连补位都做不到）。
          PATH="/Users/wane/.nvm/versions/node/v24.19.0/bin:$PATH" \
            SYNO_CI=1 bash scripts/check-content-coupling.sh || exit 1
      - name: ② 架构边界（快，阻断）
        run: |
          cd /Users/wane/.ci-work/SynovaAgent
          # 🔴 A1（CTO 裁定 124 · 派单件《两侧门禁定稿落地》v4 §A1 · 2026-10-16）：**必须注入 SYNO_CI=1**
          #   病根（名实不符 + 零防守力）：本门禁的 CI 硬阻断位是**它自己实现的**
          #     （`scripts/check-architecture.sh:32` `SYNO_CI="${SYNO_CI:-0}"`），
          #     而 local 模式对"基线外新增"**只打软提示**（契约就是本地不阻断）。
          #   ⇒ 不注入 SYNO_CI ⇒ **任何新增跨层引用都 rc=0 ⇒ 该步永不红** ⇒ 标题里的"阻断"是假的。
          #   （与上一步 ①c 在 2026-10-12 被独立复核抓出的缺陷**同型同因**，修法亦同。）
          #   实测（同一份代码，各附原始输出）：
          #     · 无新增：无 SYNO_CI ⇒ rc=0 ／ SYNO_CI=1 ⇒ rc=0（**不误伤**）
          #     · 人为新增 1 处 L1→L3：无 SYNO_CI ⇒ rc=**0**（软提示）／ SYNO_CI=1 ⇒ rc=**1**（逐行点名 file:line）
          #   `|| exit $?` **原样保留退出码**（1=真红业务阻断 ／ 2=检查自身失败 fail-closed），
          #   两个理由：① 不依赖 runner 注入的 `set -e`（本文件 ④ 步已记录同源教训：不写 `|| exit`
          #   时，本地直接跑该步正文得 rc=0 ⇒ "本地复现与 CI 不一致 = 跑的不是同一件事"）；
          #   ② 禁 `|| exit 1` 这类**退出码折叠**（CTO 立卡 #524 R-3：折叠 ⇒ 三态不可分辨）。
          PATH="/Users/wane/.nvm/versions/node/v24.19.0/bin:$PATH" \
            SYNO_CI=1 bash scripts/check-architecture.sh || exit $?
      - name: ③ 增量测试（vitest --changed；只测改动面，避免全量摩擦）
        run: |
          cd /Users/wane/.ci-work/SynovaAgent
          # CTO 2026-10-11：增量基线改用 local-main（与 D734 check-pr-budget.sh 同口径）——
          #   origin/main = GitHub 旧 main（停 5a6591c4），拿它当基线会把 local-main 全部
          #   diverge 提交的存量红算进本 PR（实测 141 tests failed，与本 PR 改动零相关）。
          #   优先 origin/local-main（CI 内 origin=本机 Gitea，必存在），不存在时回退 origin/main。
          #   只改基线，不改测试判据/门禁组数。
          CHANGED_BASE=origin/local-main
          git rev-parse --verify -q "$CHANGED_BASE" >/dev/null || CHANGED_BASE=origin/main
          echo "增量基线 = $CHANGED_BASE"
          # 🔴 2026-10-11 创始人裁决②：**区分「纯文档合法空绿」与「有代码改动却空绿 = 异常」**
          #   病根（实测）：vitest --changed 在变更集为空/无测试命中时打印
          #     No test files found, exiting with code 0
          #   ⇒ 本步恒绿。本机日志实测**连续 33 个 job** 全是这一行 ⇒ 该步不提供任何信息。
          #   为什么不能"一律变红"：合并后分支态 HEAD 常已就是基线（实测 3 个 job 的 HEAD
          #     vs local-main 变更集 = **0 文件**）⇒ 那种情况"无对象可测"是**对的**，变红即噪音。
          #   ⇒ 判据必须**分类**：先算变更集，再看它含不含代码面/测试面。
          set -o pipefail
          CHANGED_FILES="$(git diff --name-only "$CHANGED_BASE"...HEAD 2>/dev/null || true)"
          N_FILES="$(printf '%s' "$CHANGED_FILES" | grep -c . || true)"
          N_CODE="$(printf '%s' "$CHANGED_FILES" | grep -cE '^(src|tests|scripts|packages|extensions|expert|knowledge|theory)/|^\.(gitea|github)/' || true)"
          # 🔴 独立复核（2026-10-11）实测出的**假阳性**，本段即其修法：
          #   病根：N_CODE 把 `scripts/**.test.sh` / `.gitea/*.yml` 等**vitest 收集不到**的文件
          #         也算「代码面/测试面」⇒ 本 PR 自己的变更集（3 个此类文件）被自己的新判据判红
          #         （原始输出：`本次变更集: 5 文件（其中代码面/测试面 3 个）` +
          #          `No test files found, exiting with code 0` ⇒ `::error::🔴 异常空绿` ⇒ job failed）。
          #          `vitest.config.ts` include = `./tests/**/*.test.ts` ⇒ 只收集 ts 测试。
          #   修法：把「代码面」与「**vitest 可收集面**」分开计数 ——
          #         · N_VITEST = 变更集中 `*.test.ts(x)` / `*.spec.ts(x)` 的个数（vitest 真能收集的）
          #         · N_CODE_NONVITEST = 代码面里**不可被 vitest 收集**的部分（.test.sh / .yml / .py 等）
          #         判据升级为三条：① 有非 vitest 代码面改动 **且** 变更集里一个 vitest 测试都没动
          #         ⇒ 合法跳过（显式标注「不可测面」）；② 代码面含**被删除的** vitest 测试 ⇒ 异常（真丢测试）；
          #         ③ 其余有代码面却零测试 ⇒ 照旧异常。
          N_VITEST="$(printf '%s' "$CHANGED_FILES" | grep -cE '\.(test|spec)\.(ts|tsx)$' || true)"
          N_CODE_NONVITEST=$((N_CODE - N_VITEST)); [ "$N_CODE_NONVITEST" -lt 0 ] && N_CODE_NONVITEST=0
          DELETED_VITEST="$(git diff --name-only --diff-filter=D "$CHANGED_BASE"...HEAD 2>/dev/null | grep -E '\.(test|spec)\.(ts|tsx)$' || true)"
          echo "本次变更集: ${N_FILES} 文件（代码面 ${N_CODE} 个，其中 vitest 可收集 ${N_VITEST} 个；不可测面 ${N_CODE_NONVITEST} 个）"
          # 🔴 CI 可诊断性（#338 前置 · 2026-10-12 实测钉死）：Gitea runner 对**每一步**注入 `set -e`
          #   （本 job 日志 step0 的 `Wrote command` 明示 `set -e\n…`），而
          #     VITEST_OUT="$(cmd)"; VITEST_RC=$?
          #   在 `set -e` 下**子命令非 0 ⇒ 赋值语句即失败 ⇒ shell 当场退出** ⇒ 下面那行
          #   `printf | tail` **永不执行** ⇒ **vitest 一失败，整步零输出、只剩 `exit status 1`**。
          #   实证（PR #335 的 CI 红因就是被这行吞掉的，原始日志逐字）:
          #     本次变更集: 5 文件（代码面 4 个，其中 vitest 可收集 2 个；不可测面 2 个）
          #       ❌  Failure - Main ③ 增量测试（vitest --changed；只测改动面，避免全量摩擦）
          #     exit status 1
          #   ⇒ 诊断所需的一切被吞掉 ⇒ 属 #338 的「CI 可诊断性缺口」，且是本次改动引入的回退
          #     （旧写法 `… | tail -20 || { echo ::error…; exit 1; }` 反而会打印尾部输出）。
          #   修法：`set +e` 包住捕获、随后 `set -e` 恢复；失败时把**可判读摘要**写进 `::error`。
          set +e
          VITEST_OUT="$(PATH="/Users/wane/.nvm/versions/node/v24.19.0/bin:$PATH" npx vitest run --changed "$CHANGED_BASE" 2>&1)"; VITEST_RC=$?
          set -e
          printf '%s\n' "$VITEST_OUT" | tail -30
          if [ "$VITEST_RC" -eq 0 ]; then
            if printf '%s' "$VITEST_OUT" | grep -q "No test files found"; then
              if [ "$N_FILES" -eq 0 ]; then
                echo "ℹ️  合法跳过：变更集为空（HEAD 即基线/已合并）⇒ 无对象可测（既非通过也非故障）"
              elif [ "$N_CODE" -eq 0 ]; then
                echo "ℹ️  合法跳过（纯文档）：本次变更 ${N_FILES} 文件全在代码面/测试面之外 ⇒ 无测试可跑"
              elif [ -n "$DELETED_VITEST" ]; then
                echo "::error::🔴 异常空绿 —— 本次变更**删除了 vitest 测试**却被收集到零测试；这**不是通过**：测试真的丢了。"
                printf '%s\n' "$DELETED_VITEST" | head -20 | sed 's/^/     - 已删除: /'
                exit 1
              elif [ "$N_VITEST" -eq 0 ]; then
                echo "ℹ️  合法跳过（不可测面）：本次变更 ${N_CODE} 个代码面文件**均非 vitest 可收集**（如 .test.sh/.yml/.py）"
                echo "   ⇒ vitest --changed 无对象可跑属**正常**；这些面由各自门禁负责（本步只覆盖 vitest 面）。"
              else
                echo "::error::🔴 异常空绿 —— 本次变更含 ${N_VITEST} 个 vitest 可收集测试 + ${N_CODE_NONVITEST} 个不可测面文件，但 vitest 一个测试都没跑（No test files found）。这**不是通过**：要么测试丢了，要么 --changed 判据失效。"
                printf '%s\n' "$CHANGED_FILES" | grep -E '^(src|tests|scripts|packages|extensions|expert|knowledge|theory)/|^\.(gitea|github)/' | head -20 | sed 's/^/     - /'
                exit 1
              fi
            fi
            exit 0
          fi
          # 🔴 #338 可诊断性：`::error` 必须**带可判读摘要**（否则"红了你也不知道哪条挂了"）。
          #   摘要取 vitest 输出里的失败文件 / 断言行 / 计数行；无摘要时显式说明"见完整输出"。
          _V_SUM="$(printf '%s\n' "$VITEST_OUT" | grep -aE '^ *(FAIL|❯)|AssertionError|Test Files +[0-9]+ failed|Tests +[0-9]+ failed|Error: ' | head -12 | tr '\n' '|' || true)"
          [ -n "$_V_SUM" ] || _V_SUM="（vitest 未产出可提取的失败摘要 —— 见本步「tail -30」完整输出）"
          echo "::error title=增量测试失败::rc=${VITEST_RC}；摘要: $(printf '%s' "$_V_SUM" | cut -c1-900)"
          exit 1
      - name: ④ 门禁复现器自检（条件：变更集触碰工作流/复现器/夹具才跑；否则 <1s 跳过）
        run: |
          cd /Users/wane/.ci-work/SynovaAgent
          # 目的（CTO 立卡）：把两个复现器（harness）及其配对测试**接进 CI** —— 此前它们命中 0，
          #   等于「复现器只活在人工手里」；而它们保护的正是 CI 自己的语义（③ 步分类判据 / ② 步依赖指纹）。
          # 约束（CTO 立卡）：**条件跳过必须 <1s**（历史病根：门禁太重 ⇒ 超时 ⇒ 被迫 --no-verify ⇒ 链全废）。
          #   ⇒ 仅当变更集触碰下列任一文件才真跑；否则立即退出（git diff + grep，实测 <0.1s）。
          # 🔴 本步的**自证能力**（卡面判据）：`ci-emptygreen-sim.sh` 会把 ③ 步正文**逐字抽出**、以
          #   `bash -e`（与 Gitea 同构）执行 ⇒ 若有人把 ③ 步的 `set +e` 拿掉（= 复现 #338 那个
          #   「set -e 下子命令失败即退 ⇒ 整步零输出」的缺陷），该 harness 会判 HARNESS-BROKEN 并 **exit 2**
          #   ⇒ 本步在 CI 上红。即：**这条链自己抓自己**。
          CHANGED_BASE=origin/local-main
          git rev-parse --verify -q "$CHANGED_BASE" >/dev/null || CHANGED_BASE=origin/main
          FILES="$(git diff --name-only "$CHANGED_BASE"...HEAD 2>/dev/null || true)"
          if ! printf '%s\n' "$FILES" | grep -qE '^(\.gitea/workflows/local-gates\.yml|scripts/control-tower/ci-(emptygreen|deps-step)-sim\.sh|tests/control-tower/ci-(emptygreen|deps-step)-sim\.test\.sh)$'; then
            echo "ℹ️  条件跳过（变更集未触碰 工作流/复现器/夹具）—— <1s"
            exit 0
          fi
          echo "⇒ 变更集触碰复现器面 ⇒ 跑自检"
          # 🔴 **显式判红，不依赖 runner 的 `set -e`**（实测教训：不写 `|| exit` 时，本地直接跑该步正文
          #   得 rc=0 —— harness 的 rc=2 没人接；只有 CI 注入 set -e 才红 ⇒ 本地复现与 CI 不一致
          #   = 又一个"跑的不是同一件事"）。`|| exit $?` 保留原 rc（harness=2）。
