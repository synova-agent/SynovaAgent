  # ═══ D-E/③（创始人 2026-10-07 批准）: npm audit job 退役 ═══
  # 退役依据: continue-on-error + 2026-08-16 创始人裁决豁免（33 漏洞在 node-gyp 编译链，
  #   非运行时攻击面）⇒ 黄灯挂 50 天零消费方；每日占 ~1 分钟 runner 与一个 check-run 噪音。
  # 退役方式: 删 job 块 + 本注释留痕。复活条件: 上云/公网化（原豁免触发升级条件）⇒ 新卡重建。
  # 残留职责: 依赖面安全回归由 CI 外的定期人工审计 + 上云前专项承接。

  golden-case:
    # T3: timeout-minutes 基线（口径 = 只取 success；n=12；as_of=2026-10-02T12:45:00+08:00；
    # 公式 = max(P95×1.5, 中位数×3)）：audit 1 / Test-Kit(ubuntu) 1 / Golden Case 2 /
    # Gate Integrity 2 / Test-Kit(windows) 3 / Architecture 6 / Checker Review 6 /
    # Integration 6 / TypeScript+Iron Laws 7 / Vitest 8 / Control Tower(ubuntu) 14 / (windows) 106（D1109 后**未重取**：口径要 n=12 同分布样本，现 n=1）。
    timeout-minutes: 2
    name: Golden Case F1 Gate
    needs: test
    # D1111/A3 同族修（缺陷 B 第二处）: 本 job 亦承载**必需 context**（Golden Case F1 Gate）
    #   且 needs: test；上游 quality/test 任一红 ⇒ 无 job 级 `if:` 即被 skip ⇒ context 消失 ⇒
    #   PR 永久 blocked。同 test job 口径：`!cancelled()` 保证「红要红得出来」。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect docs-only change (D515)
        id: docsonly
        shell: bash   # Windows 上默认 pwsh ⇒ 必须显式 bash（本 detect 是 bash 语法）
        run: |
          # D-F/①（卡 #1227）: 白名单正则的**唯一副本** = .github/ci-criteria.txt（本文件内零内联副本）。
          # 🔴 D-F/①-fix（独立复核 R1，2026-10-07）: 单源读不到时**显式**置 docs_only=false（全量）。
          #   实测 `printf x | grep -qvE ''` 返 **1**（空正则匹配每行，-v 反选后无输出）⇒ 若依赖该
          #   隐式返回，正常路径会掉进 else ⇒ docs_only=true（早退）＝ **fail-OPEN**。
          #   故本处**不依赖 grep 隐式语义**：空/不可读 ⇒ 显式 false；不可解析 origin/main ⇒ 显式 false。
          DS_RE="$(grep -m1 '^DOCSONLY_WHITELIST_RE=' .github/ci-criteria.txt 2>/dev/null || true)"   # swallow-ok: 读失败由下一分支显式 fail-closed
          DS_RE="${DS_RE#DOCSONLY_WHITELIST_RE=}"; DS_RE="${DS_RE%$'\r'}"
          # 卡 #1323: base 解析（push 用 github.event.before；全零 SHA/不可解析 ⇒ 显式全量）。详见文件头「docs-only 判定」段。
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ -n "${GITHUB_EVENT_BEFORE:-}" ] \
             && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            DS_BASE="$GITHUB_EVENT_BEFORE"
          else
            DS_BASE="origin/main"
          fi
          if [ -z "$DS_RE" ]; then
            echo "::warning title=docs-only criteria::.github/ci-criteria.txt 缺 DOCSONLY_WHITELIST_RE 或不可读 ⇒ 显式按非 docs-only 处理（全量跑，绝不误跳）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q origin/main >/dev/null 2>&1; then
            # fail-safe（D1111 E5 原有，**保留原文**——D1023 守卫按此字面量计数 9 个消费点）:
            #   origin/main 不可解析 ⇒ 按非 docs-only 处理（全量跑，绝不误跳）
            echo "::warning title=docs-only base::origin/main 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q "$DS_BASE" >/dev/null 2>&1; then
            # fail-safe（#1323 新增）: push 的 before-sha 不可解析（含全零 SHA 退化）⇒ 全量跑
            echo "::warning title=docs-only base::base=$DS_BASE 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            DS_CHANGED="$(git diff --name-only "$DS_BASE"...HEAD 2>/dev/null || true)"   # swallow-ok: 空集/命中两条分支各自显式处置
            if [ -z "$DS_CHANGED" ]; then
              # 第三态（铁律 11: 空集 ≠ 纯文档）⇒ 无法判定 ⇒ 显式全量 + 告警，绝不静默归 docs-only
              echo "::warning title=docs-only empty-diff::base=$DS_BASE 与 HEAD 变更集为**空** ⇒ 无法判定是否纯文档 ⇒ 显式按非 docs-only 处理（全量跑）"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "$DS_CHANGED" | grep -qvE "$DS_RE"; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.docsonly.outputs.docs_only != 'true'
        with: { node-version: '22', cache: 'npm' }
      - run: bash scripts/control-tower/install-deps.sh
        if: steps.docsonly.outputs.docs_only != 'true'
      - name: Run golden case F1 gate
        if: steps.docsonly.outputs.docs_only != 'true'
        run: npx tsx scripts/ci/golden-case-checker.ts
      - name: Run diagnosis quality check
        if: steps.docsonly.outputs.docs_only != 'true'
        run: bash scripts/ci/diagnosis-quality-check.sh

  # ── M9 门禁完整性：三件套接线（task-5 检查器 + task-6 夹具/基线表；本 job 由 task-6 登记）──
  # 三步各堵一类洞，缺一步即门禁有洞（B 模式口径：登记 gate 判 = 路径出现在 ci.yml **全文**，
  #   含本 job 的 run: 行；重型夹具不入 canary 密封清单，避免 canary 运行时长翻倍）：
  #   step 1 = 检查器本体（模式哨兵 + 登记 gate；本地/CI 同一条命令）
  #   step 2 = 注入夹具**抽检**（组 1/2/7/12 + 绿基线；全量由 SYNO_PRE_COMMIT_INJECT_FULL=1
  #            人工或夜间触发——全量 ≈ 12 组 ×1 次 pre-commit，副本内实测 ~4s/次）
  #   step 3 = CI 既有红基线对账（--ci-reds /tmp/checkruns.json），取数 fail-closed
  gate-integrity:
    # T3: timeout-minutes 基线（口径 = 只取 success；n=12；as_of=2026-10-02T12:45:00+08:00；
    # 公式 = max(P95×1.5, 中位数×3)）：audit 1 / Test-Kit(ubuntu) 1 / Golden Case 2 /
    # Gate Integrity 2 / Test-Kit(windows) 3 / Architecture 6 / Checker Review 6 /
    # Integration 6 / TypeScript+Iron Laws 7 / Vitest 8 / Control Tower(ubuntu) 14 / (windows) 106（D1109 后**未重取**：口径要 n=12 同分布样本，现 n=1）。
    timeout-minutes: 2
    name: Gate Integrity (pattern sentinel + injection fixture + ci-reds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 登记 gate/模式哨兵依赖 origin/main 与完整历史（同 control-tower-tests 口径）
      # 棘轮语义（check-gate-integrity.sh 的 PATTERN-BASELINE 段，README 见该脚本头部）：
      #   存量非法模式（如 scripts/pre-commit-check.sh:991 的 `^+++` 非法 ERE——组 7a 因此恒绿）
      #   以「登记豁免 owner/expires」形式入 gate-integrity-baseline.txt → 修复未落地前不堵队列；
      #   **未登记的新非法模式仍必红**；已登记条目过期或失效（模式已消失却未清理）→ exit 1。
      #   棘轮只减不增：到期即强制清理，豁免不得续期式常驻。
      - name: Detect docs-only change (D515)
        id: docsonly
        shell: bash   # Windows 上默认 pwsh ⇒ 必须显式 bash（本 detect 是 bash 语法）
        run: |
          # D-F/①（卡 #1227）: 白名单正则的**唯一副本** = .github/ci-criteria.txt（本文件内零内联副本）。
          # 🔴 D-F/①-fix（独立复核 R1，2026-10-07）: 单源读不到时**显式**置 docs_only=false（全量）。
          #   实测 `printf x | grep -qvE ''` 返 **1**（空正则匹配每行，-v 反选后无输出）⇒ 若依赖该
          #   隐式返回，正常路径会掉进 else ⇒ docs_only=true（早退）＝ **fail-OPEN**。
          #   故本处**不依赖 grep 隐式语义**：空/不可读 ⇒ 显式 false；不可解析 origin/main ⇒ 显式 false。
          DS_RE="$(grep -m1 '^DOCSONLY_WHITELIST_RE=' .github/ci-criteria.txt 2>/dev/null || true)"   # swallow-ok: 读失败由下一分支显式 fail-closed
          DS_RE="${DS_RE#DOCSONLY_WHITELIST_RE=}"; DS_RE="${DS_RE%$'\r'}"
          # 卡 #1323: base 解析（push 用 github.event.before；全零 SHA/不可解析 ⇒ 显式全量）。详见文件头「docs-only 判定」段。
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ -n "${GITHUB_EVENT_BEFORE:-}" ] \
             && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            DS_BASE="$GITHUB_EVENT_BEFORE"
          else
            DS_BASE="origin/main"
          fi
          if [ -z "$DS_RE" ]; then
            echo "::warning title=docs-only criteria::.github/ci-criteria.txt 缺 DOCSONLY_WHITELIST_RE 或不可读 ⇒ 显式按非 docs-only 处理（全量跑，绝不误跳）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q origin/main >/dev/null 2>&1; then
            # fail-safe（D1111 E5 原有，**保留原文**——D1023 守卫按此字面量计数 9 个消费点）:
            #   origin/main 不可解析 ⇒ 按非 docs-only 处理（全量跑，绝不误跳）
            echo "::warning title=docs-only base::origin/main 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q "$DS_BASE" >/dev/null 2>&1; then
            # fail-safe（#1323 新增）: push 的 before-sha 不可解析（含全零 SHA 退化）⇒ 全量跑
            echo "::warning title=docs-only base::base=$DS_BASE 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            DS_CHANGED="$(git diff --name-only "$DS_BASE"...HEAD 2>/dev/null || true)"   # swallow-ok: 空集/命中两条分支各自显式处置
            if [ -z "$DS_CHANGED" ]; then
              # 第三态（铁律 11: 空集 ≠ 纯文档）⇒ 无法判定 ⇒ 显式全量 + 告警，绝不静默归 docs-only
              echo "::warning title=docs-only empty-diff::base=$DS_BASE 与 HEAD 变更集为**空** ⇒ 无法判定是否纯文档 ⇒ 显式按非 docs-only 处理（全量跑）"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "$DS_CHANGED" | grep -qvE "$DS_RE"; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - name: Gate integrity pattern sentinel + registration gate
        if: steps.docsonly.outputs.docs_only != 'true'
        run: bash scripts/control-tower/check-gate-integrity.sh
      # 抽检即注册（B 模式口径）——该行同时是"夹具在 CI 里无人执行"的反证。
      - name: pre-commit groups injection fixture (sampled)
        if: steps.docsonly.outputs.docs_only != 'true'
        run: bash tests/control-tower/precommit-groups-injection.test.sh
      # ── D1111/A1-①: 必需 context ⇄ job `name:` 展开名 一致性门禁（**只读**）──────────────
      # 补的缺口（D971 同型）: 无人保证「branch protection 的 12 个必需 context 名」与
      #   「workflow job `name:` 展开后实际能产出的 check-run 名」一致；改一个字符 ⇒ 必需 context
      #   静默失配 ⇒ check-run 永不上报 ⇒ PR 永久 blocked（405 "N of 12 required status checks are expected")。
      # 判据载体: scripts/control-tower/required-checks-baseline.txt（12 条）。
      # 本步**不判**「Gate Integrity 该不该进必需集」（那是语义变更，走 K3→CTO）；只判「名与名一致」。
      # 三态: 0=一致 / 1=违规（exit 1 ⇒ 本 job 红）/ 2=降级（fail-closed）。
      # 🔴 D1111 实测修正: CI 上 `github.token` **无 admin 权限**读 branch protection（本机已登录 gh 时 OK）
      #   ⇒ 首版带 `--api-check` 使本步恒 exit 2（PR #935 实测本 job 因此变红，annotation 只有
      #   "Process completed with exit code 2"）。修法：**静态面是阻断判据**（不取数、无网络、必可跑；
      #   改坏 job 名 = 必红），live 双向对账降为**显式 warning**（`--allow-degraded`：打印 degraded 原因
      #   + warning 行、exit 0）。判定不被降级削弱：静态面违规仍 exit 1。
      #   live 对账的真落点 = 本地/带 PAT 的定期任务（见 D1 §2-A1 与 D2 §6）。
      - name: Required contexts ⇄ job name consistency (A1-①, read-only)
        if: steps.docsonly.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          OUT="$(python3 scripts/control-tower/check-required-contexts.py --api-check --allow-degraded --verbose 2>&1)"; rc=$?
          printf '%s\n' "$OUT"
          printf '%s\n' "$OUT" > /tmp/required-contexts-check.out
          exit "$rc"
      # 取数失败必须让 step 失败（fail-closed，不静默放行）：豁免台账核对不到 = 既有红基线不可核。
      - name: CI red baseline reconciliation (--ci-reds, fail-closed fetch)
        if: steps.docsonly.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          OUT=/tmp/checkruns.json
          # D954（K3 定罪修复）: 对账对象 = **base**，不是当前提交。
          #   旧取数 REF=head.sha → 该时刻同 SHA 多数 job 仍 in_progress（conclusion≠failure）
          #   → 「失败检查 0 项」→ 棘轮从未被行使（同 SHA 终局实有 3 个 failure）。
          #   base 是已定态集合，才可判定"有没有既有红"。
          REF="${PR_BASE_SHA:-}"
          if [ -z "$REF" ]; then
            echo "── push 事件：base = origin/main（fetch 后解析）"
            git fetch origin main --quiet 2>/dev/null || true   # swallow-ok: fetch 失败时下方 rev-parse 仍可命中既存 origin/main；两者皆失败 → fail-closed
            REF="$(git rev-parse --verify --quiet 'origin/main^{commit}' 2>/dev/null || true)"
          fi
          if [ -z "$REF" ]; then
            echo "::error title=ci-reds base::无法解析 base ref（PR base.sha 为空且 origin/main 不可解析）—— fail-closed，不静默放行"
            exit 1
          fi
          echo "对账对象 base = ${REF}"
          printf '%s\n' "$REF" > /tmp/ci-reds-base-ref.txt
          URL="https://api.github.com/repos/${REPO}/commits/${REF}/check-runs?per_page=100"
          AUTH=()
          [ -n "${GH_TOKEN:-}" ] && AUTH=(-H "Authorization: Bearer ${GH_TOKEN}")
          ok=0
          for i in 1 2 3; do
            echo "── check-runs 取数尝试 ${i}/3: ${URL}"
            if curl -sS --fail --max-time 30 "${AUTH[@]+"${AUTH[@]}"}" \
                 -H "Accept: application/vnd.github+json" \
                 -H "X-GitHub-Api-Version: 2022-11-28" \
                 -o "$OUT" "$URL"; then
              ok=1
              break
            fi
            echo "::warning title=ci-reds fetch::第 ${i} 次取数失败（最多 3 次，退避重试）"
            sleep $((i * 5))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error title=ci-reds fetch::check-runs 取数 3 次全失败 —— fail-closed，不静默放行（既有红基线无从核对）"
            exit 1
          fi
          N=$(python3 -c "import json;print(len(json.load(open('$OUT')).get('check_runs',[])))")
          if [ "$N" -eq 0 ]; then
            echo "::warning title=ci-reds::${REF} 取到 0 条 check-runs（尚无检查记录）——基线核对为空集，不等于「已核对通过」"
          fi
          echo "check_runs=${N} (ref=${REF})"
          bash scripts/control-tower/check-gate-integrity.sh --root "$PWD" --ci-reds /tmp/checkruns.json --base-ref "$REF"
      # 证据步（M9 task-11）：判定已由前面 step 完成，本步只把关键行发布为 **可公开检索的注解**——
      #   GitHub job logs 端点匿名 404/403（CTO 证据要求 ③ 的 CI GNU 侧原始输出取不回，K3 也核不了），
      #   而注解有公开 API：GET /repos/{owner}/{repo}/check-runs/{id}/annotations（无需 token）。
      #   `|| true` 仅限本步（判定归前一步）；`if: always()` 保证失败时同样出证据；注解 ≤10 行（GitHub 上限）。
      - name: Publish gate-integrity summary (public evidence via annotations)
        if: steps.docsonly.outputs.docs_only != 'true' && (always())
        run: |
          set -uo pipefail
          # 证据步：判定已由前面 step 完成；此处只把关键行发布为可公开检索的注解
          # 带上 --ci-reds + --base-ref（若取数成功），使 C 段对账结果与**对账对象身份**同样可公开检索；
          # 缺文件则自然回落 SKIPPED（可见，不静默）。
          ARGS=""
          [ -f /tmp/checkruns.json ] && ARGS="--ci-reds /tmp/checkruns.json"
          # D954: base ref 由前一步落盘（单一解析点）；缺失则不传 → 检查器出显式 SKIPPED（不伪造判定）
          if [ -f /tmp/ci-reds-base-ref.txt ]; then
            ARGS="$ARGS --base-ref $(cat /tmp/ci-reds-base-ref.txt)"
          fi
          OUT="$(bash scripts/control-tower/check-gate-integrity.sh --root "$PWD" $ARGS 2>&1 || true)"
          # 取不到关键行时**可见但不断**（发布者不判红；真实判定见 step 1）——见下方 ::warning 分支
          # D954: 「对账对象」行**优先占一个注解位**（注解 ≤10 条上限）——保证对账对象身份必然可公开检索，
          #   不被 PATTERN/REGISTRY 等行的条数挤出（原实现 head -10 有被挤掉的风险）。
          KEY="$(echo "$OUT" | grep -E '^对账对象 = ' | head -1 || true)"
          REST="$(echo "$OUT" | grep -E '^(PATTERN-SENTINEL|PATTERN-BASELINE|CI-REGISTRY|CI-RED-CHECK|CI-RED-BASELINE|GATE-INTEGRITY):' | head -9 || true)"
          LINES="$(printf '%s\n%s\n' "$KEY" "$REST" | grep -v '^$' | head -10 || true)"
          if [ -z "$LINES" ]; then
            echo "::warning title=gate-integrity::证据步未取到关键行（检查器可能未能执行）——发布者不判红；真实判定见 step 1"
          else
            echo "$LINES" | while IFS= read -r line; do
              echo "::notice title=gate-integrity::$line"
            done
          fi

  # ══════════════════════════════════════════════════════════════════════════════════════════
  # D1147（单套门禁 · 批2）: windows 腿 = **顾问 job**（路径触发 / 非必需 / 红不拦合并）
  #
  # 病根: Mac/Win 都用 DSH ⇒ 门禁只维护一套；windows 腿的价值是「平台差异信号」
  #   （CRLF / python3 可用性 / 路径），不是「阻塞开关」。此前它是**必需** context，实测代价
  #   = control-tower windows 腿中位数 106min（vs ubuntu 14min）⇒ 平台抖动即卡死整条 PR 队列，
  #   与它承载的信息量不成比例。
  # 处置（三条约束，改任一条都要重读本段）:
  #   ① 触发 = **路径级**: 仅 `scripts/**`|`tests/**` 变更时才**执行** job（job 级 if:）⇒ 非命中
  #      PR 不占 runner、不产生任何判定。
  #      ⚠️ **机制订正（独立复核席 2026-10-05 实测 + 本线复现，改文案不改设计）**: job 级 `if:` 为 false 时
  #      **check-run 仍然存在，conclusion = `skipped`**（不是"不产 check-run"）。实测锚点: main tip
  #      `1630a5014` 的 check-runs 里恰有 1 条 `skipped`，其指向 run 37183822437 job 111381534143
  #      （`Checker Review (maker/checker)` 的 job 级 if: 在 push 事件下为 false），该 job conclusion = skipped。
  #      与 D971 的 405 **不是同一机制**: D971 是「run 根本没建」（`GITHUB_TOKEN` 推送的分支不触发
  #      workflow / workflow 级 paths 过滤）⇒ check-run 恒 0 ⇒ "N of N expected"。两者**同向**：
  #      `skipped` ≠ success，必需 context 同样得不到满足（平台语义；本仓尚无 merge_group/docs-only 现场可实测，
  #      依据标注为外部 + 本仓 `tests/control-tower/ci-signal-classify.test.sh:229-238` 的同族风险断言）。
  #      判据载体 = 上一个 job `windows-leg-trigger`（只产结论、不跑测试；origin/main 不可解析 ⇒
  #      fail-safe run=true；schedule/workflow_dispatch ⇒ 安全网无条件 true）。
  #   ② 非必需: 两个顾问 context 名**不得**再进 branch protection 必需集。理由不是"不重要"，
  #      而是**机制性**: 非 scripts PR 上这两条 context 只会以 `conclusion=skipped` 出现（见 ① 订正）
  #      ⇒ 必需检查得不到 success ⇒ 合并条件不满足（D971 同族后果；事故原文
  #      docs/synova/coordination/周报-20260922.md:58）。⇒ 路径触发与必需集**不可共存**。
  #   ③ 恒 success（**绝不产 failure 结论**）: 重活 step 用 `continue-on-error: true`，失败经
  #      `steps.*.outcome` 检查 + `::error` 注解 + `::warning` 摘要上看板。
  #      🔴 为什么不能"非必需但可以红"（本卡实测发现的跨机制相互作用）: C 段棘轮
  #      （scripts/control-tower/check-gate-integrity.sh `run_ci_reds`，L676+）对账时统计 base
  #      commit 上**全部** `conclusion == failure` 的 check-run（**不问是否必需**）⇒ 一条非必需但
  #      会红的腿，经 merge_group / 周期 run 落在 main tip 上 ⇒ 下一个 PR 的 C 段判「未登记 CI
  #      失败」⇒ 把**已入必需的 Gate Integrity** 拖红 ⇒ 间接阻断。顾问红变相成阻断 = 比不做更坏。
  #      ⇒ 本卡取"恒 success + 注解"；根治（C 段排除非必需 context）属判据变更，须 K3，另立卡。
  #   看板取数（无需 token，M9 task-11 同款公开注解面，见 gate-integrity 证据步注释）:
  #     GET /repos/{owner}/{repo}/check-runs/{id}/annotations   ← ::error / ::warning 都在这里
  # ══════════════════════════════════════════════════════════════════════════════════════════
  windows-leg-trigger:
    # D1147: 触发判据载体。**非必需**（进必需集则非命中 PR 上顾问腿只剩 `conclusion=skipped` ⇒ 必需条件
    #   不满足，见文件末 ① 机制订正）；无 needs: ⇒ 无 D1112 隐式
    #   success() 风险；自身 step 全 fail-safe（唯一失败面 = shell/写出 $GITHUB_OUTPUT 崩）。
    timeout-minutes: 2
    name: Windows Leg Trigger (D1147 path detect)
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.detect.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 三-dot diff 依赖 origin/main 完整 ref（depth=1 时不可解析）
      - name: Detect scripts/** or tests/** change (D1147)
        id: detect
        shell: bash
        run: |
          # 🔴 v2.0/方案七⑤（创始人 2026-10-07 批准）: windows 顾问腿**改 nightly 专属**。
          #   实测依据（run 37589330830）: 该腿 796s = 全 run 墙钟 809s 的 98%——非必需腿却
          #   支配全 CI 时长（其余全部 job ≤153s）。
          #   语义变更（如实记录，原 D1147 路径触发被本项取代）:
          #     · schedule（每周日）/ workflow_dispatch（人工）⇒ run=true
          #     · 其余一切事件（PR / main push）⇒ run=false ⇒ 顾问腿 check-run 以 skipped 出现
          #   代价: PR 期即时 Windows 平台信号丢失 ⇒ 回归最迟下周日夜曝光；
          #         需即时信号时用 workflow_dispatch 手动触发（保留口子，不废能力）。
          #   保留原 fail-safe 精神: 任何判断异常都倾向**跑**而非静默跳过——但本项是显式
          #   语义降频（非误跳），故只在 schedule/dispatch 下为 true，并在日志显式留痕。
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ] || [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            echo "v2.0-⑤: event=${GITHUB_EVENT_NAME} ⇒ run=true（nightly 专属 + 人工口）"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "v2.0-⑤: event=${GITHUB_EVENT_NAME} ⇒ run=false（windows 顾问腿已改 nightly 专属；需即时信号请 workflow_dispatch）"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test-kit-windows-advisory:
    # D1147 顾问腿①（承接原 `Test-Kit Architecture Tests (windows-latest)` 必需 context 的全部职责）。
    # ⚠️ context 名与旧必需名逐字相同（看板/历史可续读），但**不得**重新入必需集（见上方 ②）。
    # if 写法 = `!= 'false'`（fail-safe: 触发 job 失败/输出为空 ⇒ 照跑，绝不"静默不跑"）。
    # 🔴 timeout-minutes = 10（**不由原窗口 3min**）: 复核席 P2 指出 3min 内含 npm ci + vitest on Windows
    #   ⇒ 超时即 job 级 failure（step 级 continue-on-error **覆盖不到超时**）⇒ 会给 C 段棘轮递刀。
    #   取值口径 = 房内公式 max(P95×1.5, 中位数×3)，n=12 旧样本中位数 3min ⇒ max(4.5, 9) = 9 ⇒ 取整 10。
    #   顾问腿放宽超时的代价仅 = 真挂死时多占 runner；收益 = 关掉一条"超时 → failure check-run"通路。
    timeout-minutes: 10
    name: Test-Kit Architecture Tests (windows-latest)
    needs: windows-leg-trigger
    if: needs.windows-leg-trigger.outputs.run != 'false'
    runs-on: windows-latest
    steps:
      # 前置步骤也 `continue-on-error: true`（复核席 P2 的另一半）: checkout/setup-node 抖动若让 job 收
      #   `failure` 结论，同样会经 C 段棘轮拖红 Gate Integrity。前置失败 ⇒ 后续步骤照跑并在注解里显形
      #   （summary step 会打 warning），而 job 结论恒 success。
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        continue-on-error: true
        with: { node-version: '20', cache: 'npm' }
      # 判定与证据同一步: `continue-on-error` ⇒ step outcome=failure 但 job 结论 = success（恒不产 failure）
      - name: Run ratchet baseline test (05-as-any-audit, advisory)
        id: advisory
        continue-on-error: true
        working-directory: packages/test-kit
        # 🔴 D1173 复核整改（N1，硬回归）: 本 job 跑在 **windows-latest** 且**未声明 shell:**
        #   ⇒ 默认 **pwsh**；而 pwsh 里 `$GITHUB_WORKSPACE` 是**未定义的 PowerShell 变量**
        #   （环境变量在 pwsh 要写 `$env:`）⇒ 展开为**空串** ⇒ 路径变成 `/scripts/...`
        #   ⇒ `/usr/bin/bash: /scripts/control-tower/install-deps.sh: No such file or directory`
        #   ⇒ exit 127 + **依赖一个都没装**（随后 vitest 报 ERR_MODULE_NOT_FOUND）。
        #   实跑证据: run 37444065304 / job 112204580147（head 05bb674f9，event=pull_request）。
        #   更坏的是本 step `continue-on-error: true` ⇒ job 结论=success ⇒
        #   check `Test-Kit Architecture Tests (windows-latest)` **假绿**。
        #   ⇒ 修: 显式 `shell: bash`（bash 里 `$GITHUB_WORKSPACE` 才是环境变量）。
        shell: bash
        run: |
          bash "$GITHUB_WORKSPACE/scripts/control-tower/install-deps.sh" --prefix .
          npx vitest run tests/architecture/05-as-any-audit.test.ts
      - name: Surface advisory outcome (non-blocking, D1147)
        if: always()
        shell: bash
        run: |
          OUTCOME="${{ steps.advisory.outcome }}"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=advisory:test-kit(win)::windows 顾问腿通过（非必需；不改判定）"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "::warning title=advisory:test-kit(win)::windows 顾问腿未通过 —— **非必需检查，不拦合并**；平台缺陷细节见本 job log 与注解面"
          else
            echo "::warning title=advisory:test-kit(win)::windows 顾问腿**未执行**（outcome='${OUTCOME}'）——本次未取得平台信号（非必需，不拦合并）；前置步骤失败时属预期"
          fi
          exit 0

  control-tower-windows-advisory:
    # D1147 顾问腿②（承接原 `Control Tower Gate Tests (windows-latest)` 必需 context 的全部职责）。
    # ⚠️ 同上: 名逐字保留、**不得**重新入必需集。
    # 触发 job 失败/输出为空 ⇒ 照跑（fail-safe），绝不静默不跑。
    # timeout-minutes = 106 = 旧 windows 基线值（口径 max(P95×1.5, 中位数×3)；n=12 中位数 35.2min /
    #   P95 38.5min ⇒ 105.6 ⇒ 106）；**step 级 60min** 同旧值。复核席 P2: 顾问腿的 job 级超时即
    #   failure（step 级 continue-on-error 覆盖不到超时）⇒ 必须给足，不缩。
    timeout-minutes: 106
    name: Control Tower Gate Tests (windows-latest)
    needs: windows-leg-trigger
    if: needs.windows-leg-trigger.outputs.run != 'false'
    runs-on: windows-latest
    steps:
      # 前置步骤 `continue-on-error: true`（复核席 P2）: checkout 抖动若让 job 收 failure 结论，
      #   同样会经 C 段棘轮拖红 Gate Integrity；置为 advisory ⇒ job 结论恒 success，问题在注解里显形。
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0  # verify-parallel 豁免逻辑依赖 origin/main ref（depth=1 时缺失→误红）
      # 密封清单/平台跳过名单与 control-tower-tests(ubuntu) 的重活 step **逐字同源**：
      #   🔴 漂移后果 = 顾问腿少跑/多跑（非阻断，但信号失真）⇒ 改一处必须改两处。
      #   🔴 D-F/②（卡 #1227）: 该注释所述「清单必须在 ci.yml 全文内」的前提**已废止**——
      #   B 段登记闸改为**发现制**（面内即算纳入，见 gate-integrity-baseline.txt 段头 + sealed-tests.sh）。
      #   ⇒ 双份字面清单已删除，两腿共用**同一发现制取数**（单源），漂移风险归零。
      # 判定与证据同一步: continue-on-error ⇒ step outcome=failure 但 job 结论 = success（恒不产 failure）。
      - name: Run sealed control-tower gate tests (advisory, non-blocking)
        id: advisory
        continue-on-error: true
        timeout-minutes: 60   # 原 windows 腿实测值（D1109: n=10 中位数 1910s / P95 2393s）
        shell: bash
        run: |
          FAIL=0
          # ── D-F/②（卡 #1227）: 执行集 = **发现制**，不再逐条登记 ──────────────────
          #   发现面（tests/control-tower、tests/doc-system）由
          #   scripts/control-tower/sealed-tests.sh 唯一声明；执行集 = 面扫描 − 隔离台账
          #   （gate-integrity-baseline.txt 的 REGISTRY-BASELINE 段）。
          #   ⇒ 面内新增测试**零登记自动纳入执行**；要排除必须写进隔离台账（留痕 + 双棘轮:
          #      FACE-TOTAL 下界 / QUARANTINE-TOTAL 上界）。
          #   rc≠0 = 发现制自身违规（面为空 / 疑似删测试 / 台账失效）⇒ fail-closed 判红，绝不静默跳过。
          SEALED_LIST="$(bash scripts/control-tower/sealed-tests.sh --list)" || {
            echo "::error title=sealed-tests::发现制清单取数失败（原因见上）—— fail-closed，不静默跳过"
            exit 1
          }
          # ── SEALED-MANIFEST-BEGIN （生成物: bash scripts/control-tower/sealed-tests.sh --list）──
          #   用途: ① 兼容「接线 = 路径出现在 ci.yml 全文」类既有夹具（逐个 grep 自己的路径）；
          #        ② 人读清单。**执行集不取自本块**（取自上面的发现制取数）⇒ 本块过期不影响判定。
          #   漂移策略: **只对『块内有、执行集无』（陈旧方向）告警**；新增测试方向**不告警**——
          #        否则每个加测试的 PR 都要手改本生成物（= 变相登记制）。重生成命令见卡 note。
          # tests/control-tower/alloc-task-id-lock.test.sh
          # tests/control-tower/alloc-task-id-timeout.test.sh
          # tests/control-tower/alloc-task-id.test.sh
          # tests/control-tower/brief-parser-strip.test.sh
          # tests/control-tower/check-canary-drift.test.sh
          # tests/control-tower/check-citations.test.sh
          # tests/control-tower/check-doc-contract.test.sh
          # tests/control-tower/check-dsh-anchor.test.sh
          # tests/control-tower/check-gate-integrity.test.sh
          # tests/control-tower/check-gitlinks.test.sh
          # tests/control-tower/check-k3-report.test.sh
          # tests/control-tower/check-name-allocation.test.sh
          # tests/control-tower/check-ontology-fields.test.sh
          # tests/control-tower/check-preset-bundles.test.sh
          # tests/control-tower/check-progress-freshness.test.sh
          # tests/control-tower/check-project-coordinates.test.sh
          # tests/control-tower/check-required-contexts.test.sh
          # tests/control-tower/ci-ratchet-base.test.sh
          # tests/control-tower/ci-signal-classify.test.sh
          # tests/control-tower/ci-strict-visible.test.sh
          # tests/control-tower/claim-regex-narrow.test.sh
          # tests/control-tower/classify-worktrees.test.sh
          # tests/control-tower/clone-config-init.test.sh
          # tests/control-tower/clone-shadow-commit.test.sh
          # tests/control-tower/ct-test-gate.test.sh
          # tests/control-tower/d956-failmsg.test.sh
          # tests/control-tower/daily-cto-board-ratio.test.sh
          # tests/control-tower/fastlane-bypass-only.test.sh
          # tests/control-tower/fastlane-extended.test.sh
          # tests/control-tower/g12-day-window.test.sh
          # tests/control-tower/gate-failopen-net.test.sh
          # tests/control-tower/gate-retirement-report.test.sh
          # tests/control-tower/gate-stats.test.sh
          # tests/control-tower/grep-oP-regression.test.sh
          # tests/control-tower/incident-loop.test.sh
          # tests/control-tower/install-deps.test.sh
          # tests/control-tower/install-dsh-preset.test.sh
          # tests/control-tower/log-snapshot.test.sh
          # tests/control-tower/loop-context.test.sh
          # tests/control-tower/merge_writeset_gate.test.sh
          # tests/control-tower/parallel-main-tree-occupancy.test.sh
          # tests/control-tower/platform-checklist.test.sh
          # tests/control-tower/post-commit-marker.test.sh
          # tests/control-tower/post-commit.test.sh
          # tests/control-tower/q2-error-locating.test.sh
          # tests/control-tower/scan-fullwidth-vars.test.sh
          # tests/control-tower/sealed-tests.test.sh
          # tests/control-tower/simulate-ci.test.sh
          # tests/control-tower/skeleton-brief-gate.test.sh
          # tests/control-tower/sync_project_coordinates.test.sh
          # tests/control-tower/synova-commit.test.sh
          # tests/control-tower/synova-submit.test.sh
          # tests/control-tower/tag-ancestry.test.sh
          # tests/control-tower/task-start-parallel.test.sh
          # tests/control-tower/validate_doc_contract.test.sh
          # tests/control-tower/verdict-baseline.test.sh
          # tests/control-tower/verify-claims-table.test.sh
          # tests/control-tower/verify-doc.test.sh
          # tests/control-tower/verify-parallel-ci.test.sh
          # tests/control-tower/verify-parallel.test.sh
          # tests/control-tower/write-set-check.test.sh
          # tests/doc-system/check-doc-truth.test.sh
          # tests/doc-system/doc-categories.test.sh
          # tests/doc-system/doc-registry-gate.test.sh
          # tests/doc-system/doc-staleness.test.sh
          # tests/doc-system/doc-triage.test.sh
          # tests/doc-system/generate-chronicle-monthly.test.sh
          # ── SEALED-MANIFEST-END ──
          # 漂移提示（**不判红**）：本块是生成物，过期只影响「人读 + 遗留接线夹具」的可读性。
          MANIFEST_BLOCK="$(sed -n '/SEALED-MANIFEST-BEGIN/,/SEALED-MANIFEST-END/p' .github/workflows/ci.yml | sed 's/^ *//; s/^# *//' | grep -E '^tests/' | sort -u)"
          # 只报**陈旧方向**（块内有、执行集无）；新增方向静默——新增测试不得要求人手改生成物（Lead 裁 2026-10-07）
          MANIFEST_STALE="$(comm -23 <(printf '%s\n' "$MANIFEST_BLOCK") <(printf '%s\n' $SEALED_LIST | sort -u) | tr '\n' ' ')"
          if [ -n "${MANIFEST_STALE// /}" ]; then
            echo "::warning title=sealed-manifest::SEALED-MANIFEST 块含执行集外的陈旧条目（生成物需重生成）: ${MANIFEST_STALE}——重生成: bash scripts/control-tower/sealed-tests.sh --list | sed 's|^|          # |'（不判红）"
          fi
          FAIL=0
          # PY 三级探测（D520 平台适配：禁裸 python3）——供执行器对 .py 夹具分派
          SEALED_PYBIN=""
          for _c in python3 python py; do
            if command -v "$_c" >/dev/null 2>&1 && "$_c" -c "import sys" >/dev/null 2>&1; then SEALED_PYBIN="$_c"; break; fi
          done
          for t in $SEALED_LIST; do
            echo "── $t"
            # D1094 平台跳过名单（**只在顾问腿**；分层原则：平台无关的失败不该污染 Windows 信号，
            #   但**显式打印**不静默）。背景 2026-10-01 实测: 这两条夹具在 Windows(Git Bash) 下失败，
            #   根因是 classify-worktrees.py / verdict-baseline.py 的 Windows 兼容缺陷（D1094 修复）。
            case "${RUNNER_OS:-}:$t" in
              Windows:tests/control-tower/classify-worktrees.test.sh|Windows:tests/control-tower/verdict-baseline.test.sh)
                echo "  ⏭ SKIP(Windows): D1094 待修 —— Python 工具 Windows 兼容缺陷（另见卡 note）"
                continue ;;
            esac
            # SEALED-RUNNER-BEGIN（夹具按标记提取本段做行为断言；改格式须同步 tests/control-tower/sealed-runner-dispatch.test.sh）
            #   D-F/②-fix（Lead 裁 2026-10-07）: 执行器**按扩展名分派**——`.py` 用 python 解释器跑，
            #   其余用 bash 跑。旧实现一律 `bash "$t"` ⇒ `.py` 夹具必然 `import: command not found`（CI 实测）。
            #   PY 三级探测（D520 平台适配：禁裸 python3）；缺解释器 ⇒ 显式 FAIL（fail-closed，不静默跳过）。
            _RC=0
            case "$t" in
              *.py)
                if [ -z "$SEALED_PYBIN" ]; then
                  echo "FAIL: ${t}（缺 python 解释器：python3/python/py 三级探测全失败）"
                  echo "::error title=$t::sealed-runner 缺 python 解释器 ⇒ .py 夹具无法执行（fail-closed）"
                  FAIL=1
                  continue
                fi
                "$SEALED_PYBIN" "$t" > /tmp/ct-out-advisory.log 2>&1 || _RC=$? ;;
              *)
                bash "$t" > /tmp/ct-out-advisory.log 2>&1 || _RC=$? ;;
            esac
            # SEALED-RUNNER-END
            if [ "$_RC" -ne 0 ]; then
              echo "FAIL: $t"
              tail -8 /tmp/ct-out-advisory.log 2>/dev/null || true
              echo "::error title=advisory:$t::windows 顾问腿未通过（**非必需检查，不拦合并**；全文见 job log）"
              FAIL=1
            fi
          done
          # D943: DSH 断面一致性自扫（与 ubuntu 腿同款；CI 无本地 DSH 树 → --no-tree-check）
          if ! python3 scripts/control-tower/check-dsh-anchor.py --repo . --no-tree-check; then
            echo "::error title=advisory:check-dsh-anchor::DSH 断面自扫失败（非必需，不拦合并）"
            FAIL=1
          fi
          bash scripts/control-tower/check-canary-drift.sh || true
          exit $FAIL
      - name: Surface advisory outcome (non-blocking, D1147)
        if: always()
        shell: bash
        run: |
          OUTCOME="${{ steps.advisory.outcome }}"
          if [ "$OUTCOME" = "success" ]; then
            echo "::notice title=advisory:control-tower(win)::windows 顾问腿通过（非必需；不改判定）"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "::warning title=advisory:control-tower(win)::windows 顾问腿未通过 —— **非必需检查，不拦合并**；平台缺陷见本 job 的 ::error 注解与 log"
          else
            echo "::warning title=advisory:control-tower(win)::windows 顾问腿**未执行**（outcome='${OUTCOME}'）——本次未取得平台信号（非必需，不拦合并）；前置步骤失败时属预期"
          fi
          exit 0

  # ═══ P0-3: 聚合必需检查 —— skipped 也判 FAIL ═══
  # 蓝本: DSH 上游 ci.yml:700-726（dsh-v0.2.0-rc.2；steps 段逐字）
  # 与蓝本的三处已声明差异（K3 整改 D1177，原「唯一差异」表述不实）:
  #   ① if 去掉 pull_request 事件限定（CTO 明令——#905 语境为 main push）
  #   ② name: all checks passed → All Checks Passed（对齐本仓 check-run 命名习惯）
  #   ③ runs-on: 上游 failover 选择器 → ubuntu-latest（failover 机制本仓未建）
  # 归因口径（K3 整改订正）: 本 job 治的是 **job 级 skip 族**（job 结论 success/skipped 不可辨，
  #   D971/D1111/D1147 系）。#905 实为 **step 级 skip**（docs-only 误判 ⇒ job 内重步骤 skip
  #   但 job=success）——needs.*.result 物理上看不见 step 级 skip，那层归 D1111 路径锚正则/
  #   D708/D540 管。本 job 是纵深一层，不是「修 #905」。
  # needs = 8 个 job 键，恰覆盖 9 条必需 context（test 是 2-shard 矩阵，覆盖 Vitest 1/2+2/2）。
  # 🔴 不纳入 needs 的（非必需，纳入会把它们的红也变成阻断）:
  #   audit(npm audit) · gate-integrity · windows-leg-trigger
  #   · test-kit-windows-advisory · control-tower-windows-advisory
  # 🔴 与 DSH 蓝本的唯一差异: 去掉 `github.event_name == 'pull_request'`
  #   理由: push 到 main 同样必须被拦（#905 的假绿正是发生在 main push 语境）。
  # ⚠️ 上界（必须留档）: 本 job 挡不住「PR 自己改 ci.yml 把本 job 改成恒绿」——
  #   PR 事件跑的是 PR 头分支里的 workflow（#905 事故机制）；只保证 (a) skip 掉必需
  #   job ⇒ 必红；(b) 改实现 ⇒ 挡不住（需 pull_request_target，下一张卡）。
  all-checks-passed:
    name: All Checks Passed
    runs-on: ubuntu-latest
    # 注: needs 必须单行 —— check-required-contexts.py 的 YAML 子集解析器不支持续行
    #     （多行会 fail-closed degrade ⇒ required-contexts 全量检查降级失败）。
    needs: [quality, test, architecture, test-kit-architecture, control-tower-tests, integration-check, checker-review, golden-case]
    if: ${{ !cancelled() }}
    steps:
      - name: Fail if any needed job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::Needed job results: ${{ join(needs.*.result, ', ') }}"
          exit 1
      - name: All checks passed
        run: echo "All needed jobs succeeded (${{ join(needs.*.result, ', ') }})"
