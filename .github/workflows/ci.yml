name: CI �� SynovaAgent

on:
  push:
    # N12 根治（D1014）: 去掉 feat/* —— 每次 feature push 都跑全量 CI 是队列放大器。
    # 依赖 push 的检查改为「开/更新 PR 时触发」（pull_request 面已覆盖）。
    branches: [main]
  pull_request:
    branches: [main]
    # D1014 ⒞: 触发类型显式化（原为默认 opened/synchronize/reopened + 新增 ready_for_review）
    types: [opened, synchronize, reopened, ready_for_review]
  # D1070 / X30 M0①（Q3 迁移硬顺序 ①）: merge group 事件必须能触发本 workflow。
  # 为什么必须先加这一行: merge queue 合入时 GitHub 在 merge group 上建的是临时合并分支；
  #   若 workflow 不声明 merge_group，队列里**永远不产生 required check** → 全队列等到超时卡死
  #   （与 D515 同族坑）。故本行是 M3（开 merge queue）的物理先决条件，必须先于开队列合入。
  # 为何不能只靠 pull_request: 队列走的是 merge_group 事件，PR 事件不在队列合入路径上。
  merge_group:
  # ── D1039 安全网②③（①②③ 全貌见 control-tower-tests job 头注释块）──────────────────
  # ② 手动强制: 判据误判/排障时人工强制跑 control-tower 重活（默认 false，不改变日常行为）。
  workflow_dispatch:
    inputs:
      force_control_tower_tests:
        description: "安全网②: 强制跑 control-tower 重活（绕过路径判据；其余 job 照常跑）"
        type: boolean
        default: false
  # ③ 周期兜底: 每 7 天（周日 20:00 UTC）无条件全量跑一次 control-tower 重活。
  #   用途: 判据路径集漂移 / 门禁腐化，在"长时间不碰控制塔路径"的静默期也能暴露（最坏延迟 7 天）。
  #   其余 job 在本 run 里**保持原始行为（恒跑）**——不额外加 job 级 if:（队长 D1039 裁决:
  #   多 9 处 job 级 if = 把"必需 context 可能被 skip"的风险面从 2 个扩到 12 个，收益仅省 ~326s/周）。
  #   D1147 新增的 3 个 job 不受此裁决约束: 它们**不承载必需 context**（advisor 腿 + 触发 job），
  #   故 job 级 if: 不引入"必需 context 被 skip"风险；且它们的门控是**路径触发**（非 schedule 门控），
  #   在 schedule/dispatch 下按安全网②③ 无条件跑（见文件末 D1147 段）。
  schedule:
    - cron: "0 20 * * 0"

# N12 根治（D1014 · CTO 已批）: 同 workflow + 同 ref 只保留最新一条 run。
# 依据: 全仓此前 concurrency = 0 ⇒ 同分支反复 push 无限排队（实测 feat/d962-2a-merge 独占 18 条，
# 全队列一度 38 queued 不消费）。cancel-in-progress 让"新 run 取消旧 run"。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # T3: timeout-minutes 基线（口径 = 只取 success；n=12；as_of=2026-10-02T12:45:00+08:00；
    # 公式 = max(P95×1.5, 中位数×3)）：audit 1 / Test-Kit(ubuntu) 1 / Golden Case 2 /
    # Gate Integrity 2 / Test-Kit(windows) 3 / Architecture 6 / Checker Review 6 /
    # Integration 6 / TypeScript+Iron Laws 7 / Vitest 8 / Control Tower(ubuntu) 14 / (windows) 106（D1109 后**未重取**：口径要 n=12 同分布样本，现 n=1）。
    timeout-minutes: 7
    name: TypeScript + Lint + Iron Laws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # D515 项7: 纯文档 PR 的 CI 瘦身 — 全部变更为 md/json/task-state/.claude 时
      # 跳过 TS+Iron Laws 重检查（只跳 job 内步骤，不跳 job——PR 状态仍可读）。
      # Secrets 由独立 job 扫描，不受影响。混合 PR 正常全量。
      # 注: main push 合并后 diff 为空 → 按纯文档跳过（PR 门已验证，避免空跑）。
      - name: Detect docs-only change (D515)
        id: docsonly
        shell: bash   # Windows 上默认 pwsh ⇒ 必须显式 bash（本 detect 是 bash 语法）
        run: |
          # 白名单锚定分层（D1111/A5 修: 全部**逐条带路径锚**）:
          #   依据（K3 W-1 原话「无锚点」＋研究院 A5 实测）: 旧式无锚点正则 ⇒
          #   **任何** .json（package.json / tsconfig.json / src/**/*.json）与**任何**深度同名目录
          #   （src/task-state/**）都被判「纯文档」⇒ 10 个 job 空转、必需 context 假绿。
          #   本窗实测: 全仓 .json 共 981 件，旧正则下**全部**走 docs-only（含 tsconfig/eslintrc）。
          #   🔴 D-F/①（卡 #1227）: 判据文本**不再内联**——唯一真值源 =
          #      `.github/ci-criteria.txt` 的 `DOCSONLY_WHITELIST_RE`（本文件内零内联副本，
          #      D1023 守卫在 CI HARD 下断言「内联副本 = 0 且消费点 = 9」）。
          #      逐条分层理由与全量清单见该文件头注释；本处只留**消费**代码。
          #      改判据 ⇒ 改那一个文件（它自身不在白名单分支内 ⇒ 必走全量 CI，自举安全）。
          #   🔴 卡 #1323（原号 #1236）更正本条: 曾写「空变更集 ⇒ 仍按 docs-only（原语义保留）」——
          #      该行为**已被检验为缺陷**：`push` 到 main 时 HEAD == origin/main ⇒ `origin/main...HEAD`
          #      为空 ⇒ `grep -qvE` 无行命中返 1 ⇒ 落 else ⇒ `docs_only=true` ⇒ **本判定在 main 上永久
          #      判为早退** ⇒ 若干控制条件同时倒向"跳过"。这是"**已知行为 + 其分支后果从未被检验**"，
          #      不是"漏了个边界"。⇒ 新语义: ① push 事件 base = `github.event.before`（推送前提交），
          #      PR/merge_group 维持 `origin/<base_ref>`；② **全零 SHA**（首次 push/force push）或 base
          #      不可解析 ⇒ 显式全量；③ **空变更集 = 显式第三态**（`::warning` + 按**非** docs-only 处理）
          #      —— 与同段「判据不可读」「origin/main 不可解析」两处 fail-closed **同向**（不可判 ⇒ 全量）。
          #   ⚠️ 结构留痕: 本判定块在**本文件内内联 9 份**（逐字节同源；D1023 守卫的「消费点 = 9」；
          #      本次 9 份**同改**）。「改一处源」的前提不成立 ⇒ 去重属另卡（见 PR 正文例外清单）。
          #   ⚠️ D1111/独立自验 E5: 本处此前**缺** `git rev-parse --verify origin/main`
          #      fail-safe（其余处均有）⇒ origin/main 不可解析时本处会**早退为 docs-only**（方向相反：
          #      别处全量、本处瘦身）。空 diff 时 grep -qvE 返 1 同样早退 ⇒ 两条路径都收敛到「早退」。
          #      ⇒ 已补 fail-safe，与其余各处**同一判据、同一降级方向**（不可解析 ⇒ 全量，绝不误跳）。
          # D1023/P1 修: .gitattributes/.gitmodules 不在白名单 —— .gitattributes 是 CI 运行时
          #   语义载体（*.sh eol=lf、merge=union、scripts/audit/** -text），改它即改 CI 本身
          #   须走全量；.gitmodules 仓库不存在，留着 = 新增子模块+文档即零验证入库。
          # D-F/①（卡 #1227）: 白名单正则的**唯一副本** = .github/ci-criteria.txt（本文件内零内联副本）。
          # 🔴 D-F/①-fix（独立复核 R1，2026-10-07）: 单源读不到时**显式**置 docs_only=false（全量）。
          #   实测 `printf x | grep -qvE ''` 返 **1**（空正则匹配每行，-v 反选后无输出）⇒ 若依赖该
          #   隐式返回，正常路径会掉进 else ⇒ docs_only=true（早退）＝ **fail-OPEN**。
          #   故本处**不依赖 grep 隐式语义**：空/不可读 ⇒ 显式 false；不可解析 origin/main ⇒ 显式 false。
          DS_RE="$(grep -m1 '^DOCSONLY_WHITELIST_RE=' .github/ci-criteria.txt 2>/dev/null || true)"   # swallow-ok: 读失败由下一分支显式 fail-closed
          DS_RE="${DS_RE#DOCSONLY_WHITELIST_RE=}"; DS_RE="${DS_RE%$'\r'}"
          # 卡 #1323: base 解析（push 用 github.event.before；全零 SHA/不可解析 ⇒ 显式全量）。详见文件头「docs-only 判定」段。
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ -n "${GITHUB_EVENT_BEFORE:-}" ] \
             && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            DS_BASE="$GITHUB_EVENT_BEFORE"
          else
            DS_BASE="origin/main"
          fi
          if [ -z "$DS_RE" ]; then
            echo "::warning title=docs-only criteria::.github/ci-criteria.txt 缺 DOCSONLY_WHITELIST_RE 或不可读 ⇒ 显式按非 docs-only 处理（全量跑，绝不误跳）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q origin/main >/dev/null 2>&1; then
            # fail-safe（D1111 E5 原有，**保留原文**——D1023 守卫按此字面量计数 9 个消费点）:
            #   origin/main 不可解析 ⇒ 按非 docs-only 处理（全量跑，绝不误跳）
            echo "::warning title=docs-only base::origin/main 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q "$DS_BASE" >/dev/null 2>&1; then
            # fail-safe（#1323 新增）: push 的 before-sha 不可解析（含全零 SHA 退化）⇒ 全量跑
            echo "::warning title=docs-only base::base=$DS_BASE 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            DS_CHANGED="$(git diff --name-only "$DS_BASE"...HEAD 2>/dev/null || true)"   # swallow-ok: 空集/命中两条分支各自显式处置
            if [ -z "$DS_CHANGED" ]; then
              # 第三态（铁律 11: 空集 ≠ 纯文档）⇒ 无法判定 ⇒ 显式全量 + 告警，绝不静默归 docs-only
              echo "::warning title=docs-only empty-diff::base=$DS_BASE 与 HEAD 变更集为**空** ⇒ 无法判定是否纯文档 ⇒ 显式按非 docs-only 处理（全量跑）"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "$DS_CHANGED" | grep -qvE "$DS_RE"; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      # ═══ #1215 / CT-34 上界（K3 2026-10-07 双卡报告 B 节）: 纯文档 PR 的 **merge 级**登记对账 ═══
      # 缺口: docs-only 早退跳过 Iron Laws（= 提交端 D782 文档真相防线: D1 truth + D2 登记门禁）
      #   ⇒ 未登记的新 docs/*.md 可在纯文档 PR 里零检查入库（K3 物理复现: 探针 + SYNO_CI=1 ⇒ rc=0）。
      # 修法: 仅在 docs_only == 'true' 分支补跑 **D2 登记门禁**（scripts/doc-system/doc-registry-gate.sh）——
      #   它按 base..HEAD 新增文档对账 docs/authority/DOCS-REGISTRY.yaml；PR 语境能读完整 diff（fetch-depth: 0）。
      # 判定: 新 .md 未登记 ⇒ 本 step 红 ⇒ 本 job 承载的必需 context 红（merge 级阻断 + 逐个点名文件）。
      #   非 docs-only PR **不重复跑**（它们已在 Iron Laws 的 D782 块内硬阻断，避免同判据双跑）。
      # 排除面（生成物/历史区/证据区/审计报告等，无需登记）见 scripts/doc-system/doc-registry-gate.sh 头注释 EXCLUDE。
      # 三态: 0=全登记 / 1=有未登记（红）/ 2=调用错误（红）；台账缺失 ⇒ 脚本自身显式降级 exit 0（不误伤）。
      - name: Docs registry reconciliation (docs-only PRs, #1215)
        if: steps.docsonly.outputs.docs_only == 'true'
        run: bash scripts/doc-system/doc-registry-gate.sh
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
        if: steps.docsonly.outputs.docs_only != 'true'
      - run: bash scripts/control-tower/install-deps.sh
        if: steps.docsonly.outputs.docs_only != 'true'
      # D703 (K3 W-1) 证据命令机器化: 非 docs-only PR 改动 dev-doc → 按文件名 D 号
      # 回放对应 scripts/ci/verify-dXXX.sh 自证脚本（DS 命令从文档字符串升级为 CI 实跑）。
      # 缺对应脚本 → ::warning 显式 skip（不静默，倒逼各卡交付自证脚本）。
      - name: Replay changed dev-doc evidence commands (D703)
        if: steps.docsonly.outputs.docs_only != 'true'
        run: |
          CHANGED_DOCS=$(git diff --name-only origin/main...HEAD -- 'docs/plans/codex/implementation/SYNOVA-IMPL-*.md' || true)
          if [ -z "$CHANGED_DOCS" ]; then
            echo "skip: 本次未改动 dev-doc（docs/plans/codex/implementation/）"
            exit 0
          fi
          FAIL=0
          for doc in $CHANGED_DOCS; do
            DNUM=$(basename "$doc" | grep -oE 'D[0-9]+' | head -1 || true)
            if [ -z "$DNUM" ]; then
              echo "::warning title=verify-doc skip::$(basename "$doc") 文件名无 D 号，无法定位 verify-dXXX.sh（跳过）"
              continue
            fi
            # spec 文件名 D 号为大写（D703），自证脚本仓库惯例为小写（verify-d703.sh）——
            # 不转小写则 ubuntu 大小写敏感恒 warning skip（CI 首轮实证）
            DLOW=$(printf '%s' "$DNUM" | tr 'A-Z' 'a-z')
            SCRIPT="scripts/ci/verify-${DLOW}.sh"
            if [ ! -f "$SCRIPT" ]; then
              echo "::warning title=verify-doc skip::${SCRIPT} 不存在——$(basename "$doc") 的 DS 命令未接入 CI 回放（该卡应交付自证脚本）"
              continue
            fi
            echo "── $SCRIPT ← $doc"
            if ! bash "$SCRIPT" > /tmp/verify-doc-replay.log 2>&1; then
              echo "FAIL: $SCRIPT"
              # tail -60 而非 -20: 回放输出约 45 行（19×3 spec skip + D# 段 + 汇总），
              # -20 会把 [FAIL] 行截掉只剩 skip 尾巴（首轮实证无法定位失败 DS）
              cat /tmp/verify-doc-replay.log
              echo "::error title=verify-doc replay::${SCRIPT} 回放失败（$doc）"
              FAIL=1
            fi
          done
          exit $FAIL
      - name: TypeScript check
        if: steps.docsonly.outputs.docs_only != 'true'
        # K3 审计 P1-1 修复：去掉 `|| true` fail-open（CI 类型检查永不红 → 挪 CI 后类型防线真空）。
        # 过滤存量白名单（_extinct 退役哨兵死代码 + ima.ts/server.ts 已知错误 + 4 个历史文件），
        # 其余新类型错误 → exit 1 阻断。存量清理后逐步收紧白名单。
        run: |
          ERRORS=$(npx tsc --noEmit --pretty false 2>&1 | grep -v "_extinct/\|ima.ts\|server.ts\|sentinel-service.ts\|industry-loader.ts\|tool-registration.ts\|llm-provider-loader.ts" | grep -E "error TS" || true)
          if [ -n "$ERRORS" ]; then
            echo "$ERRORS"
            exit 1
          fi
      - name: Iron laws check
        if: steps.docsonly.outputs.docs_only != 'true'
        run: bash scripts/pre-commit-check.sh
        env:
          SYNO_DIFF_BASE: "origin/main"
          SYNO_CI: "1"  # D516/K3 P0-1: CI strict——本地 V5 软提示在 CI 转硬（权威物理落地）
      # D540: verify-parallel 已从本地 pre-push 移 CI/PR —— CI 权威物理拦截写集重叠
      #   base..HEAD write set vs origin/main 已合 dev doc write set（fetch-depth:0 需完整历史，已确认）
      #   纯文档 PR 跳过；混合 PR 正常跑。
      - name: Verify parallel declaration (D540, moved from local pre-push)
        if: steps.docsonly.outputs.docs_only != 'true'
        run: |
          # base..head 写集 × 已合 PR 写集 —— CI 权威物理拦截写集重叠
          bash scripts/control-tower/verify-parallel.sh --ci-pr origin/main
      # D708: 合并级写集对账 gate —— 本 PR 变更集 × **本 PR 自己的声明**（intra-PR 夹带）。
      #   与上一 step（verify-parallel: 本 PR × 已合 PR 写集，inter-PR 重叠）**正交**，不重复造。
      #   触发点 = 合并前（PR job）：出现夹带即红并逐文件点名；main/master push 自动跳过。
      # 🔴 D1039 修复（根治）: merge-commit subject 里的**全长 SHA** 被 `DID_RE` 误当任务号 ⇒ 假 D# ⇒ 判红。
      #   **修的是门禁本体**（`scripts/control-tower/merge_writeset_gate.py`），**不是本 step 的入参** ——
      #   本 step 保持**上游原样**（`--head HEAD`）。
      #   根因（实测，非推断）: pull_request 事件下 actions/checkout 检出的 HEAD 是合成 merge 提交，
      #   subject 形如 `Merge <40位sha> into <40位sha>`；旧 `DID_RE = re.compile(r"[Dd]\d+")` 无词边界
      #   ⇒ 命中所里十六进制（实测 `b65b**d63**b68` ⇒ findall ['d63','d287','d9','d3'] ⇒ 推断 **D63**）
      #   ⇒ 派生到无关 dev doc ⇒ 声明 0 条 ⇒ **exit 2**（本批 run 实见）。
      #   ⇒ 已改为 `(?<![0-9A-Za-z])[Dd]\d+(?![0-9A-Za-z])`（同一 subject → findall []）
      #   ⇒ 实测真 `refs/pull/872/merge`（d1ba4905）由 EXIT=2 → **EXIT=0**（推断回 D1039）。
      #   ⚠️ **禁止**把本 step 的 `--head` 改成引用 PR head 的表达式（即 event 的 PR head 字段）：
      #      那是 K3 定罪的「空转取数形态」，`tests/control-tower/check-gate-integrity.test.sh:641-643`
      #      有**接线回退**硬断言 —— 该断言是**字面 grep**，连注释里出现该字面串都会 FAIL（本批实撞）。
      #      且**不必要** —— 根治后 `--head HEAD`（merge ref 形态）自身即可正确推断。
      #   回归夹具: `tests/control-tower/merge_writeset_gate.test.sh` ⑩b（真 merge subject 零误判）
      #      与 ⑩c（还原旧正则即失效 ⇒ 判别性）。
      - name: Merge write-set reconciliation (D708)
        if: steps.docsonly.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # #1284（2026-10-07）: **接 --pr-body**。旧形态只能从 GITHUB_EVENT_PATH（事件体快照）读正文，
          #   而 GitHub **re-run 重放原事件快照、不重抓正文** ⇒ 「改正文 → 重跑」永远无效
          #   （#1273 实证：正文 13:45 加豁免，重跑 attempt 2 读到的仍是 13:31 旧正文）。
          #   本步显式取一次**当前**正文落文件再传参；取不到 ⇒ **显式降级**（::warning，禁静默）。
          set -uo pipefail
          PR_BODY_FILE="${RUNNER_TEMP:-/tmp}/d708-pr-body.md"
          BODY_ARGS=()
          if [ -n "${PR_NUMBER:-}" ]; then
            if gh pr view "$PR_NUMBER" --json body --jq .body > "$PR_BODY_FILE" 2>/tmp/d708-body.err; then
              BODY_ARGS=(--pr-body "$PR_BODY_FILE")
              echo "D708 正文来源: gh pr view #${PR_NUMBER} —— **当前**正文（re-run 亦刷新，非事件体快照）"
              # 可见证据: 让「解析到的豁免行」进日志（旧形态日志里只有模板文案，看不出喂没喂到输入）
              if grep -qE '^#{2,4}[[:space:]]*写集豁免' "$PR_BODY_FILE"; then
                echo "D708 正文含「写集豁免」段，逐条豁免行（原样打印，供审计）:"
                sed -n '/^#\{2,4\}[[:space:]]*写集豁免/,/^#\{1,4\}[[:space:]]/p' "$PR_BODY_FILE" | grep -n '^- ' | head -20 || true
              fi
            else
              echo "::warning title=d708-pr-body::gh pr view #${PR_NUMBER} 取正文失败 ⇒ 回退事件体快照（可能过期，re-run 场景尤甚）；stderr: $(tr '\n' ' ' < /tmp/d708-body.err 2>/dev/null | head -c 200)"
            fi
          else
            echo "::notice title=d708-pr-body::本事件无 PR 正文可取（merge_group/push ⇒ event.pull_request 为空）⇒ 仅声明文件源生效；PR 正文的「写集豁免」段在此路径**不适用**（显式说明，非静默跳过）"
          fi
          python3 scripts/control-tower/merge_writeset_gate.py \
            --base origin/main --head HEAD --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" ${BODY_ARGS[@]+"${BODY_ARGS[@]}"}

  test:
    # T3: timeout-minutes 基线（口径 = 只取 success；n=12；as_of=2026-10-02T12:45:00+08:00；
    # 公式 = max(P95×1.5, 中位数×3)）：audit 1 / Test-Kit(ubuntu) 1 / Golden Case 2 /
    # Gate Integrity 2 / Test-Kit(windows) 3 / Architecture 6 / Checker Review 6 /
    # Integration 6 / TypeScript+Iron Laws 7 / Vitest 8 / Control Tower(ubuntu) 14 / (windows) 106（D1109 后**未重取**：口径要 n=12 同分布样本，现 n=1）。
    # 🔴 W1d/D1164（治理线，2026-10-06）: 8 → 15。**实测该 job 被自己的 timeout 杀掉**：
    #   step「Run tests」在**3/3** 条 run 里 conclusion=cancelled（37364788318 / 37421437721 /
    #   37423639714），每条都在 job 起始后 **~8m15s** 终止 ⇒ 是 timeout 杀，不是测试失败。
    #   shard 1/2 实测跑到 6m57s 仍被切；同 run 的 shard 2/2「Run tests」只用 46s ⇒ 严重不均。
    #   ⚠️ 该 job 承载**必需 context** `Vitest (1/2)` ⇒ 非 docs-only PR 因此永久 blocked。
    #   原基线（注释里 n=12）口径是「只取 success」——而 main 的 run 全是 docs-only（skip），
    #   样本里根本没有"真跑的非 docs run" ⇒ 8 分钟是**没被真实负载校准过**的值。
    #   若 15 分钟仍被杀，则不是超时问题而是 shard 不均/测试挂死（另卡）。
    timeout-minutes: 15
    name: Vitest (${{ matrix.shard }})
    needs: quality
    # D1111/A3 缺陷 B 修（研究院 A3 提案，机械实现）: 上游 quality 红时，job 级无 `if:` ⇒ 本 job
    #   被 skip ⇒ 两个**必需 context**（Vitest (1/2) / (2/2)）不产生 check-run ⇒ GitHub 报
    #   「N of 12 required status checks are expected」⇒ PR 永久 blocked，而不是显示一个红。
    #   （实证: ci-red-baseline.txt:24 记 `Vitest (1/2)` 已列 owner=CTO-Mac 的存量红。）
    #   修法 = job 级 `if: ${{ !cancelled() }}`：上游失败/未通过时**照跑并如实报红**（红是红，
    #   不再消失）；仅 workflow 被手动取消时不跑（`always()` 会连取消都硬跑，故用 !cancelled()）。
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect docs-only change (D515)
        id: docsonly
        shell: bash   # Windows 上默认 pwsh ⇒ 必须显式 bash（本 detect 是 bash 语法）
        run: |
          # D-F/①（卡 #1227）: 白名单正则的**唯一副本** = .github/ci-criteria.txt（本文件内零内联副本）。
          # 🔴 D-F/①-fix（独立复核 R1，2026-10-07）: 单源读不到时**显式**置 docs_only=false（全量）。
          #   实测 `printf x | grep -qvE ''` 返 **1**（空正则匹配每行，-v 反选后无输出）⇒ 若依赖该
          #   隐式返回，正常路径会掉进 else ⇒ docs_only=true（早退）＝ **fail-OPEN**。
          #   故本处**不依赖 grep 隐式语义**：空/不可读 ⇒ 显式 false；不可解析 origin/main ⇒ 显式 false。
          DS_RE="$(grep -m1 '^DOCSONLY_WHITELIST_RE=' .github/ci-criteria.txt 2>/dev/null || true)"   # swallow-ok: 读失败由下一分支显式 fail-closed
          DS_RE="${DS_RE#DOCSONLY_WHITELIST_RE=}"; DS_RE="${DS_RE%$'\r'}"
          # 卡 #1323: base 解析（push 用 github.event.before；全零 SHA/不可解析 ⇒ 显式全量）。详见文件头「docs-only 判定」段。
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ -n "${GITHUB_EVENT_BEFORE:-}" ] \
             && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            DS_BASE="$GITHUB_EVENT_BEFORE"
          else
            DS_BASE="origin/main"
          fi
          if [ -z "$DS_RE" ]; then
            echo "::warning title=docs-only criteria::.github/ci-criteria.txt 缺 DOCSONLY_WHITELIST_RE 或不可读 ⇒ 显式按非 docs-only 处理（全量跑，绝不误跳）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q origin/main >/dev/null 2>&1; then
            # fail-safe（D1111 E5 原有，**保留原文**——D1023 守卫按此字面量计数 9 个消费点）:
            #   origin/main 不可解析 ⇒ 按非 docs-only 处理（全量跑，绝不误跳）
            echo "::warning title=docs-only base::origin/main 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q "$DS_BASE" >/dev/null 2>&1; then
            # fail-safe（#1323 新增）: push 的 before-sha 不可解析（含全零 SHA 退化）⇒ 全量跑
            echo "::warning title=docs-only base::base=$DS_BASE 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            DS_CHANGED="$(git diff --name-only "$DS_BASE"...HEAD 2>/dev/null || true)"   # swallow-ok: 空集/命中两条分支各自显式处置
            if [ -z "$DS_CHANGED" ]; then
              # 第三态（铁律 11: 空集 ≠ 纯文档）⇒ 无法判定 ⇒ 显式全量 + 告警，绝不静默归 docs-only
              echo "::warning title=docs-only empty-diff::base=$DS_BASE 与 HEAD 变更集为**空** ⇒ 无法判定是否纯文档 ⇒ 显式按非 docs-only 处理（全量跑）"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "$DS_CHANGED" | grep -qvE "$DS_RE"; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.docsonly.outputs.docs_only != 'true'
        with: { node-version: '20', cache: 'npm' }
      - run: bash scripts/control-tower/install-deps.sh
        if: steps.docsonly.outputs.docs_only != 'true'
      - name: Run tests
        if: steps.docsonly.outputs.docs_only != 'true'
        env:
          NO_COLOR: "1"
        run: |
          # D721: 变更集必须以 **与 main 的合并基点** 为基准（三点差）。
          #   旧判据 HEAD~1..HEAD 在合并提交（刷新分支时 git merge origin/main）上会把「被并入的 main 全部改动」
          #   算作本 PR 改动 → 存量红被误判为新增红 → PR 永红（#513 实证：head 与 main 内容 git diff 为 0 却判 3 个新增失败）。
          BASE=$(git merge-base refs/remotes/origin/main HEAD 2>/dev/null || git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE"..HEAD 2>/dev/null || echo "")
            echo "变更集基准: merge-base(origin/main, HEAD)=${BASE}（三点差：仅本 PR 引入的改动）"
          else
            CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || git diff --name-only origin/main..HEAD 2>/dev/null || echo "")
            echo "::warning::origin/main 不可用，回退 HEAD~1..HEAD 判据（合并提交下会误判存量失败为新增）"
          fi
          # D-E/②（卡 #1226 · 创始人 2026-10-07 批准方案七⑥）: 默认 **`--changed`**——
          #   只跑「本 PR 影响面」的测试（vitest 内部即 `git diff --name-only <since>...HEAD`
          #   + 反向 import 图闭包，与上面 BASE 三点差同口径）；**nightly / 人工触发 ⇒ 全量**。
          #   降级方向（一律「多跑」，绝不「少跑」）:
          #     · event 非 PR/push（schedule/workflow_dispatch）⇒ 全量
          #     · BASE 不可解析 ⇒ 全量（可见 ::warning）
          #     · `--passWithNoTests` **必需**：changed 模式下选中 0 个测试是合法结果
          #       （否则 vitest 在 shard 校验处抛 `--shard <count> must be ...` ⇒ 必需 context 假红）
          RUN_MODE=changed
          if [ "${GITHUB_EVENT_NAME:-}" = "schedule" ] || [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ]; then
            RUN_MODE=full
          fi
          if [ "$RUN_MODE" = "changed" ] && [ -z "$BASE" ]; then
            RUN_MODE=full
            echo "::warning title=vitest mode::BASE 不可解析 ⇒ 回退全量（绝不误跳）"
          fi
          echo "vitest 运行模式: ${RUN_MODE}（event=${GITHUB_EVENT_NAME:-unknown} shard=${{ matrix.shard }} base=${BASE:0:8}）"
          if [ "$RUN_MODE" = "changed" ]; then
            OUTPUT=$(npx vitest run --changed "$BASE" --passWithNoTests --shard=${{ matrix.shard }} --reporter=verbose 2>&1; echo "EXIT:$?")
          else
            OUTPUT=$(npx vitest run --shard=${{ matrix.shard }} --reporter=verbose 2>&1; echo "EXIT:$?")
          fi
          echo "$OUTPUT"
          EXIT_CODE=$(echo "$OUTPUT" | grep "EXIT:" | sed 's/.*EXIT://')
          if [ "$EXIT_CODE" = "0" ]; then exit 0; fi
          # 去除 ANSI 颜色码后提取失败文件列表
          CLEAN_OUTPUT=$(echo "$OUTPUT" | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g')
          FAILED_TESTS=$(echo "$CLEAN_OUTPUT" | grep " FAIL " | grep -oP 'tests/\S+\.test\.ts' || true)
          if [ -n "$FAILED_TESTS" ] && [ -n "$CHANGED" ]; then
            NEW_FAILURES=""
            while IFS= read -r tf; do
              SOURCE_FILE=$(echo "$tf" | sed 's|^tests/|src/|; s|\.test\.ts|.ts|' | sed 's|-sentinel||' || true)
              if echo "$CHANGED" | grep -qF "$SOURCE_FILE" 2>/dev/null || echo "$CHANGED" | grep -qF "$tf" 2>/dev/null; then
                NEW_FAILURES="${NEW_FAILURES}${tf}\n"
              fi
            done <<< "$FAILED_TESTS"
            if [ -z "$NEW_FAILURES" ]; then
              # D721: 放行必须可见（铁律 11 静默降级禁止）。存量红是**真红**，不是噪音——
              #   实测 main 021897a0 的 Vitest 就是靠这条放行的（3 failed / 286 passed 而作业 success）。
              echo "::warning::Vitest 存量红放行（非本 PR 改动文件引入，main 上同样红）: $(echo "$FAILED_TESTS" | tr '\n' ' ')"
              echo "PREEXISTING_RED_FILES:"
              echo "$FAILED_TESTS"
              echo "→ 这些是真红，已登记 board-backlog: PLAN-main-vitest-preexisting-red（须烧掉，勿长期依赖放行）"
              exit 0
            fi
            echo "本 PR 引进的测试失败（阻断）:"
            echo -e "$NEW_FAILURES"
          fi
          exit 1

  architecture:
