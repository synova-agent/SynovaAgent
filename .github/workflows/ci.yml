          # tests/control-tower/check-required-contexts.test.sh
          # tests/control-tower/ci-ratchet-base.test.sh
          # tests/control-tower/ci-signal-classify.test.sh
          # tests/control-tower/ci-strict-visible.test.sh
          # tests/control-tower/claim-regex-narrow.test.sh
          # tests/control-tower/classify-worktrees.test.sh
          # tests/control-tower/clone-config-init.test.sh
          # tests/control-tower/clone-shadow-commit.test.sh
          # tests/control-tower/ct-test-gate.test.sh
          # tests/control-tower/d956-failmsg.test.sh
          # tests/control-tower/daily-cto-board-ratio.test.sh
          # tests/control-tower/fastlane-bypass-only.test.sh
          # tests/control-tower/fastlane-extended.test.sh
          # tests/control-tower/g12-day-window.test.sh
          # tests/control-tower/gate-failopen-net.test.sh
          # tests/control-tower/gate-retirement-report.test.sh
          # tests/control-tower/gate-stats.test.sh
          # tests/control-tower/grep-oP-regression.test.sh
          # tests/control-tower/incident-loop.test.sh
          # tests/control-tower/install-deps.test.sh
          # tests/control-tower/install-dsh-preset.test.sh
          # tests/control-tower/log-snapshot.test.sh
          # tests/control-tower/loop-context.test.sh
          # tests/control-tower/merge_writeset_gate.test.sh
          # tests/control-tower/parallel-main-tree-occupancy.test.sh
          # tests/control-tower/platform-checklist.test.sh
          # tests/control-tower/post-commit-marker.test.sh
          # tests/control-tower/post-commit.test.sh
          # tests/control-tower/q2-error-locating.test.sh
          # tests/control-tower/scan-fullwidth-vars.test.sh
          # tests/control-tower/sealed-tests.test.sh
          # tests/control-tower/simulate-ci.test.sh
          # tests/control-tower/skeleton-brief-gate.test.sh
          # tests/control-tower/sync_project_coordinates.test.sh
          # tests/control-tower/synova-commit.test.sh
          # tests/control-tower/synova-submit.test.sh
          # tests/control-tower/tag-ancestry.test.sh
          # tests/control-tower/task-start-parallel.test.sh
          # tests/control-tower/validate_doc_contract.test.sh
          # tests/control-tower/verdict-baseline.test.sh
          # tests/control-tower/verify-claims-table.test.sh
          # tests/control-tower/verify-doc.test.sh
          # tests/control-tower/verify-parallel-ci.test.sh
          # tests/control-tower/verify-parallel.test.sh
          # tests/control-tower/write-set-check.test.sh
          # tests/doc-system/check-doc-truth.test.sh
          # tests/doc-system/doc-categories.test.sh
          # tests/doc-system/doc-registry-gate.test.sh
          # tests/doc-system/doc-staleness.test.sh
          # tests/doc-system/doc-triage.test.sh
          # tests/doc-system/generate-chronicle-monthly.test.sh
          # ── SEALED-MANIFEST-END ──
          # 漂移提示（**不判红**）：本块是生成物，过期只影响「人读 + 遗留接线夹具」的可读性。
          MANIFEST_BLOCK="$(sed -n '/SEALED-MANIFEST-BEGIN/,/SEALED-MANIFEST-END/p' .github/workflows/ci.yml | sed 's/^ *//; s/^# *//' | grep -E '^tests/' | sort -u)"
          # 只报**陈旧方向**（块内有、执行集无）；新增方向静默——新增测试不得要求人手改生成物（Lead 裁 2026-10-07）
          MANIFEST_STALE="$(comm -23 <(printf '%s\n' "$MANIFEST_BLOCK") <(printf '%s\n' $SEALED_LIST | sort -u) | tr '\n' ' ')"
          if [ -n "${MANIFEST_STALE// /}" ]; then
            echo "::warning title=sealed-manifest::SEALED-MANIFEST 块含执行集外的陈旧条目（生成物需重生成）: ${MANIFEST_STALE}——重生成: bash scripts/control-tower/sealed-tests.sh --list | sed 's|^|          # |'（不判红）"
          fi
          FAIL=0
          # PY 三级探测（D520 平台适配：禁裸 python3）——供执行器对 .py 夹具分派
          SEALED_PYBIN=""
          for _c in python3 python py; do
            if command -v "$_c" >/dev/null 2>&1 && "$_c" -c "import sys" >/dev/null 2>&1; then SEALED_PYBIN="$_c"; break; fi
          done
          for t in $SEALED_LIST; do
            echo "── $t"
            # SEALED-RUNNER-BEGIN（夹具按标记提取本段做行为断言；改格式须同步 tests/control-tower/sealed-runner-dispatch.test.sh）
            #   D-F/②-fix（Lead 裁 2026-10-07）: 执行器**按扩展名分派**——`.py` 用 python 解释器跑，
            #   其余用 bash 跑。旧实现一律 `bash "$t"` ⇒ `.py` 夹具必然 `import: command not found`（CI 实测）。
            #   PY 三级探测（D520 平台适配：禁裸 python3）；缺解释器 ⇒ 显式 FAIL（fail-closed，不静默跳过）。
            _RC=0
            case "$t" in
              *.py)
                if [ -z "$SEALED_PYBIN" ]; then
                  echo "FAIL: ${t}（缺 python 解释器：python3/python/py 三级探测全失败）"
                  echo "::error title=$t::sealed-runner 缺 python 解释器 ⇒ .py 夹具无法执行（fail-closed）"
                  FAIL=1
                  continue
                fi
                "$SEALED_PYBIN" "$t" > /tmp/ct-out.log 2>&1 || _RC=$? ;;
              *)
                bash "$t" > /tmp/ct-out.log 2>&1 || _RC=$? ;;
            esac
            # SEALED-RUNNER-END
            if [ "$_RC" -ne 0 ]; then
              echo "FAIL: $t"
              # D956-MSG-START（夹具 tests/control-tower/d956-failmsg.test.sh 按此标记提取本段做行为断言，改格式须同步夹具）
              # D956①: 失败断言行优先入窗——FAIL|❌|not ok 命中行先入，不被 tail 窗挤掉
              HITS=$(grep -E 'FAIL|❌|not ok' /tmp/ct-out.log 2>/dev/null | head -4 || true)
              TAILW=$(tail -8 /tmp/ct-out.log 2>/dev/null || true)
              RAW=$(printf '%s\n%s' "$HITS" "$TAILW" | grep -v '^$' | awk '!seen[$0]++' | tr '\n' '|' | tr -d '%')
              # D956②: 字符级截断（原 cut -c1-450 按字节，中文≈150 字即断）+ 截断自报
              MSG="$RAW"
              if [ "${#RAW}" -gt 450 ]; then
                MSG="${RAW:0:400}…[truncated; full log: /tmp/ct-out.log + job raw output]"
              fi
              # D956③: 三态——构造失败/空日志 ⇒ 显式降级注解，不静默通过（FAIL=1 已设）
              if [ -z "$MSG" ]; then
                MSG="[D956-degraded] annotation-construction-empty; full log: /tmp/ct-out.log + job raw output"
                echo "::warning title=D956::$t 注解构造降级（空日志或 grep 不可用）"
              fi
              echo "::error title=$t::$MSG"
              # D956-MSG-END
              FAIL=1
            fi
          done
          # D943: DSH 断面一致性自扫（CI 无本地 DSH 树 → --no-tree-check；文档一致性仍全查）。
          # 独立命令而非加入上方 for 清单——清单项由 `bash "$t"` 执行，命令串不可混入。
          if ! python3 scripts/control-tower/check-dsh-anchor.py --repo . --no-tree-check; then
            echo "::error title=check-dsh-anchor::DSH 断面自扫失败（见上方 ❌ file:line）"
            FAIL=1
          fi
          # D526: canary 密封清单漂移告警（::warning 可见，不阻断——防误伤；
          #   存量漂移由 K3/人工月度清理，全量密封化是 K3 P2-4 单独立项）
          bash scripts/control-tower/check-canary-drift.sh || true
          exit $FAIL

  integration-check:
    # T3: timeout-minutes 基线（口径 = 只取 success；n=12；as_of=2026-10-02T12:45:00+08:00；
    # 公式 = max(P95×1.5, 中位数×3)）：audit 1 / Test-Kit(ubuntu) 1 / Golden Case 2 /
    # Gate Integrity 2 / Test-Kit(windows) 3 / Architecture 6 / Checker Review 6 /
    # Integration 6 / TypeScript+Iron Laws 7 / Vitest 8 / Control Tower(ubuntu) 14 / (windows) 106（D1109 后**未重取**：口径要 n=12 同分布样本，现 n=1）。
    timeout-minutes: 6
    name: Integration Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect docs-only change (D515)
        id: docsonly
        shell: bash   # Windows 上默认 pwsh ⇒ 必须显式 bash（本 detect 是 bash 语法）
        run: |
          # D-F/①（卡 #1227）: 白名单正则的**唯一副本** = .github/ci-criteria.txt（本文件内零内联副本）。
          # 🔴 D-F/①-fix（独立复核 R1，2026-10-07）: 单源读不到时**显式**置 docs_only=false（全量）。
          #   实测 `printf x | grep -qvE ''` 返 **1**（空正则匹配每行，-v 反选后无输出）⇒ 若依赖该
          #   隐式返回，正常路径会掉进 else ⇒ docs_only=true（早退）＝ **fail-OPEN**。
          #   故本处**不依赖 grep 隐式语义**：空/不可读 ⇒ 显式 false；不可解析 origin/main ⇒ 显式 false。
          DS_RE="$(grep -m1 '^DOCSONLY_WHITELIST_RE=' .github/ci-criteria.txt 2>/dev/null || true)"   # swallow-ok: 读失败由下一分支显式 fail-closed
          DS_RE="${DS_RE#DOCSONLY_WHITELIST_RE=}"; DS_RE="${DS_RE%$'\r'}"
          # 卡 #1323: base 解析（push 用 github.event.before；全零 SHA/不可解析 ⇒ 显式全量）。详见文件头「docs-only 判定」段。
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ -n "${GITHUB_EVENT_BEFORE:-}" ] \
             && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            DS_BASE="$GITHUB_EVENT_BEFORE"
          else
            DS_BASE="origin/main"
          fi
          if [ -z "$DS_RE" ]; then
            echo "::warning title=docs-only criteria::.github/ci-criteria.txt 缺 DOCSONLY_WHITELIST_RE 或不可读 ⇒ 显式按非 docs-only 处理（全量跑，绝不误跳）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q origin/main >/dev/null 2>&1; then
            # fail-safe（D1111 E5 原有，**保留原文**——D1023 守卫按此字面量计数 9 个消费点）:
            #   origin/main 不可解析 ⇒ 按非 docs-only 处理（全量跑，绝不误跳）
            echo "::warning title=docs-only base::origin/main 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q "$DS_BASE" >/dev/null 2>&1; then
            # fail-safe（#1323 新增）: push 的 before-sha 不可解析（含全零 SHA 退化）⇒ 全量跑
            echo "::warning title=docs-only base::base=$DS_BASE 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            DS_CHANGED="$(git diff --name-only "$DS_BASE"...HEAD 2>/dev/null || true)"   # swallow-ok: 空集/命中两条分支各自显式处置
            if [ -z "$DS_CHANGED" ]; then
              # 第三态（铁律 11: 空集 ≠ 纯文档）⇒ 无法判定 ⇒ 显式全量 + 告警，绝不静默归 docs-only
              echo "::warning title=docs-only empty-diff::base=$DS_BASE 与 HEAD 变更集为**空** ⇒ 无法判定是否纯文档 ⇒ 显式按非 docs-only 处理（全量跑）"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "$DS_CHANGED" | grep -qvE "$DS_RE"; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.docsonly.outputs.docs_only != 'true'
        with: { node-version: '20', cache: 'npm' }
      - run: bash scripts/control-tower/install-deps.sh
        if: steps.docsonly.outputs.docs_only != 'true'
      - name: L1+L2 integration checks
        if: steps.docsonly.outputs.docs_only != 'true'
        run: bash scripts/workflow/check-integration.sh

  checker-review:
