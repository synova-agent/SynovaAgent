            #   origin/main 不可解析 ⇒ 按非 docs-only 处理（全量跑，绝不误跳）
            echo "::warning title=docs-only base::origin/main 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q "$DS_BASE" >/dev/null 2>&1; then
            # fail-safe（#1323 新增）: push 的 before-sha 不可解析（含全零 SHA 退化）⇒ 全量跑
            echo "::warning title=docs-only base::base=$DS_BASE 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            DS_CHANGED="$(git diff --name-only "$DS_BASE"...HEAD 2>/dev/null || true)"   # swallow-ok: 空集/命中两条分支各自显式处置
            if [ -z "$DS_CHANGED" ]; then
              # 第三态（铁律 11: 空集 ≠ 纯文档）⇒ 无法判定 ⇒ 显式全量 + 告警，绝不静默归 docs-only
              echo "::warning title=docs-only empty-diff::base=$DS_BASE 与 HEAD 变更集为**空** ⇒ 无法判定是否纯文档 ⇒ 显式按非 docs-only 处理（全量跑）"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "$DS_CHANGED" | grep -qvE "$DS_RE"; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - uses: actions/setup-node@v4
        if: steps.docsonly.outputs.docs_only != 'true'
        with: { node-version: '20', cache: 'npm' }
      - name: Install test-kit deps
        if: steps.docsonly.outputs.docs_only != 'true'
        working-directory: packages/test-kit
        run: bash "$GITHUB_WORKSPACE/scripts/control-tower/install-deps.sh" --prefix .
      - name: Run ratchet baseline test (05-as-any-audit)
        if: steps.docsonly.outputs.docs_only != 'true'
        working-directory: packages/test-kit
        run: npx vitest run tests/architecture/05-as-any-audit.test.ts
      # D565 登记: architecture 套件余 4 文件（01/02/04）存量红（wiring-audit 引用已
      # 拆接线、>1000 行文件、l4 import）——从未入 CI 故腐化未察。修复归编码线
      # （CT-51 队列），修复一个入列一个；全绿后本 job 收敛为跑全目录。

  # ══ D1039: control-tower 重活「按需跑」—— 判据唯一载体 = scripts/control-tower/ci-signal-classify.sh ══
  # 🔴 必需 context 约束（不可违背）: **本 job 的 `Control Tower Gate Tests (ubuntu-latest)`**
  #   是 main 分支保护的必需检查之一（D1147 后必需集 9 条，登记表 =
  #   scripts/control-tower/required-checks-baseline.txt；旧证据 scripts/control-tower/ci-red-baseline.txt:65-66
  #   与 docs/synova/coordination/CI-诊断通道.md:115-116 成文于 12 条时代，按 D1147 状态读）。
  #   ⚠️ `(windows-latest)` 自 D1147 起**已不是必需 context**（降级为顾问 job，见文件末 D1147 段）
  #   —— 它现在**必须**带 job 级 `if:`（路径触发），而正是这一点使它不能是必需 context。
  #   **禁止 job 级 `paths:` 过滤**——job 不被创建 ⇒ 不产生 check-run ⇒ 必需 context 永不报告
  #   ⇒ PR 永久 blocked。同型事故原文: 405 "12 of 12 required status checks are expected."
  #   （docs/synova/coordination/周报-20260922.md:58）；D971「必需检查三路修复」即治此类
  #   （git log 0e8b6420: test/golden-case 改 needs + if: always() + 首步显式 gate）。
  #   ⇒ 本 job **恒被调度**（不加 job 级 if: / paths:），只在 job 内用 step 级 `if:` 门控重活：
  #     被 `if:` 跳过的 step 不影响本 job 以 success 上报必需 context。
  # ★ 三条安全网（判据可能漏判时，最坏后果 = 多跑一次，绝不 = 该跑没跑）:
  #   ① fail-safe 判据: 命中才跑重活（见下方 `Classify` step）；判据降级（base 不可解析 /
  #      git 不可用）⇒ 分类器强制 run=true 全量跑 + stderr 留痕，消费方「可见但不阻断」。
  #   ② 手动强制: workflow_dispatch 触发本身即无条件跑本 job 重活（见下方重活 step 的 if:）；
  #      布尔输入 force_control_tower_tests 为该意图的显式/可审计形式（默认 false）。
  #   ③ 周期兜底: schedule 每 7 天无条件跑（本 run 里其余 job 保持原始恒跑行为，不加门控；
  #      D1147 新增的 3 个 job 亦不加门控，顾问腿在 schedule 下按安全网②③ 无条件跑）。
  # ✎ 触发/不触发清单指针: 路径集（super-set 口径 = 今天会触发全量 CI 且控制塔域可能受影响的）=
  #   .github/workflows/**（全体 workflow，不止 ci.yml —— check-progress-freshness.test.sh:42 真会
  #   grep progress-freshness-watchdog.yml）｜ .gitattributes（*.sh eol=lf 检出层，不覆盖=净回归）
  #   ｜ .gitmodules ｜ scripts/**（全树）｜ tests/control-tower/** ｜ tests/doc-system/**
  #   ｜ tsconfig*.json ｜ package.json。
  #   分类器 RULES 表为唯一判据（逐条理由在该脚本注释内）；改路径集必须同步
  #   tests/control-tower/ci-signal-classify.test.sh 的判别性夹具。
  # ══════════════════════════════════════════════════════════════════════════════════════════
  control-tower-tests:
    # T3 止血（CTO 已批）：job/step 级 timeout-minutes。
    # 基线声明 = **只取 success**；n=12 / 中位数 35.2min / P95 38.5min /
    # as_of=2026-10-02T12:45:00+08:00 / 公式 = max(P95×1.5, 中位数×3)
    #   ⇒ max(38.5×1.5, 35.2×3) = max(57.75, 105.6) = 105.6 ⇒ 取整 106（windows）。
    # ubuntu 分支同表：中位数 274s / P95 301s ⇒ max(451.5, 822) = 822s ⇒ 14min。
    # 关键 step「Run hermetic control-tower gate tests」= 13min（须 < job 级 14）。
    #   ↳ windows 行（106 / step 60min）自 D1147 起由**顾问 job**
    #     `control-tower-windows-advisory` 承载（非必需），见文件末 D1147 段。
    timeout-minutes: 14
    name: Control Tower Gate Tests (${{ matrix.os }})
    # D520/任务2: 双平台矩阵——平台问题（CRLF/python3/路径）不再等 Win 实测暴露。
    #   D1147（单套门禁）: windows 腿移出本矩阵 → 降级为**顾问 job**
    #   `control-tower-windows-advisory`（仅 scripts/**|tests/** 变更时创建；非必需；红不拦合并）。
    #   ⚠️ 本 job「恒被调度 + 无 job 级 if:/paths: + 矩阵单元素」是**硬约束**（必需 context
    #   `Control Tower Gate Tests (ubuntu-latest)` 的唯一产出者）；钉死它的断言在
    #   tests/control-tower/ci-signal-classify.test.sh:229-244，勿改。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # D520: verify-parallel 豁免逻辑依赖 origin/main ref（depth=1 时缺失→误红）
      - name: Detect docs-only change (D515)
        id: docsonly
        shell: bash   # Windows 上默认 pwsh ⇒ 必须显式 bash（本 detect 是 bash 语法）
        run: |
          # D-F/①（卡 #1227）: 白名单正则的**唯一副本** = .github/ci-criteria.txt（本文件内零内联副本）。
          # 🔴 D-F/①-fix（独立复核 R1，2026-10-07）: 单源读不到时**显式**置 docs_only=false（全量）。
          #   实测 `printf x | grep -qvE ''` 返 **1**（空正则匹配每行，-v 反选后无输出）⇒ 若依赖该
          #   隐式返回，正常路径会掉进 else ⇒ docs_only=true（早退）＝ **fail-OPEN**。
          #   故本处**不依赖 grep 隐式语义**：空/不可读 ⇒ 显式 false；不可解析 origin/main ⇒ 显式 false。
          DS_RE="$(grep -m1 '^DOCSONLY_WHITELIST_RE=' .github/ci-criteria.txt 2>/dev/null || true)"   # swallow-ok: 读失败由下一分支显式 fail-closed
          DS_RE="${DS_RE#DOCSONLY_WHITELIST_RE=}"; DS_RE="${DS_RE%$'\r'}"
          # 卡 #1323: base 解析（push 用 github.event.before；全零 SHA/不可解析 ⇒ 显式全量）。详见文件头「docs-only 判定」段。
          if [ "${GITHUB_EVENT_NAME:-}" = "push" ] && [ -n "${GITHUB_EVENT_BEFORE:-}" ] \
             && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            DS_BASE="$GITHUB_EVENT_BEFORE"
          else
            DS_BASE="origin/main"
          fi
          if [ -z "$DS_RE" ]; then
            echo "::warning title=docs-only criteria::.github/ci-criteria.txt 缺 DOCSONLY_WHITELIST_RE 或不可读 ⇒ 显式按非 docs-only 处理（全量跑，绝不误跳）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q origin/main >/dev/null 2>&1; then
            # fail-safe（D1111 E5 原有，**保留原文**——D1023 守卫按此字面量计数 9 个消费点）:
            #   origin/main 不可解析 ⇒ 按非 docs-only 处理（全量跑，绝不误跳）
            echo "::warning title=docs-only base::origin/main 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          elif ! git rev-parse --verify -q "$DS_BASE" >/dev/null 2>&1; then
            # fail-safe（#1323 新增）: push 的 before-sha 不可解析（含全零 SHA 退化）⇒ 全量跑
            echo "::warning title=docs-only base::base=$DS_BASE 不可解析 ⇒ 显式按非 docs-only 处理（全量跑）"
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            DS_CHANGED="$(git diff --name-only "$DS_BASE"...HEAD 2>/dev/null || true)"   # swallow-ok: 空集/命中两条分支各自显式处置
            if [ -z "$DS_CHANGED" ]; then
              # 第三态（铁律 11: 空集 ≠ 纯文档）⇒ 无法判定 ⇒ 显式全量 + 告警，绝不静默归 docs-only
              echo "::warning title=docs-only empty-diff::base=$DS_BASE 与 HEAD 变更集为**空** ⇒ 无法判定是否纯文档 ⇒ 显式按非 docs-only 处理（全量跑）"
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            elif printf '%s\n' "$DS_CHANGED" | grep -qvE "$DS_RE"; then
              echo "docs_only=false" >> "$GITHUB_OUTPUT"
            else
              echo "docs_only=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      # ── D1039 安全网①: 路径判据（分类器脚本产结论；本 step 只消费结论）──────────────
      #   ⚠️ D1111/独立自验 E6 更正: 此处旧注曾写「路径判据唯一载体 = 分类器脚本」，与事实不符——
      #   `ci-signal-classify.sh` 内**不含** docs-only 白名单正则（那 10 份副本在 ci.yml 内联）。
      #   分类器管的是「control-tower 重活是否跑」，与 docs-only 瘦身是**两套**判据，勿互指。
      # 三态（Ctrl-tower 模式 1）: 0 = 正常（run 可真可假）｜2 = 降级（分类器已强制 run=true +
      #   stderr 留痕）⇒ 降级必须「可见但不阻断」——安全值（全量跑）已在效果上生效，不该把 PR
      #   判红；1 = 分类器自身失败（调用非法/内部不一致）⇒ 真红可见，倒逼修复（不静默放行）。
      # 🔴 errexit 陷阱（本 step 的实现理由）: GH Actions `shell: bash` 实为
      #   `bash --noprofile --norc -eo pipefail {0}`——**带 -e**。裸 `cmd; RC=$?` 在 -e 下
      #   RC 赋值永不执行（死代码）⇒ 分类器一降级(2) 直接判 step 红 ⇒ job 红 ⇒ 必需 context 红
      #   ⇒ PR blocked（正是本卡要消灭的失效模式），且后续重活 step 因隐式 success() 被 skip。
      #   ⇒ 必须写成 `cmd || RC=$?`（失败被 || 列表吸收，errexit 不触发）。
      #   判别性夹具: tests/control-tower/ci-signal-classify.test.sh 用例 C（GH 语义下跑本正文）。
      - name: Classify control-tower CI signal (D1039)
        id: ctsignal
        shell: bash   # Windows 上默认 pwsh ⇒ 必须显式 bash（分类器是 bash 语法）
        run: |
          RC=0
          bash scripts/control-tower/ci-signal-classify.sh --mode github || RC=$?
          if [ "$RC" -eq 2 ]; then
            echo "::warning title=ci-signal-classify::分类器降级（exit 2）——已强制 run=true 全量跑（绝不误跳；详见 stderr 留痕）"
            exit 0
          fi
          if [ "$RC" -eq 1 ]; then
            echo "::error title=ci-signal-classify::分类器自身失败（exit 1）——fail-closed，不静默放行"
            exit 1
          fi
          exit 0
      # ── D1039/L-WIRE: D1023 docs-only 白名单判别性夹具（"移除了才绿、加回去就红"）──────────
      # 身份: #861 把 `.gitattributes`/`.gitmodules` 加进 docs-only 早退白名单的判别性夹具，
      #   已在 main（docs/synova/product-lines/evidence/D1023-861-docsonly-guard.sh，168 行）；
      #   本轮把它接进 CI —— 此前它**零可执行调用点**（`git grep -l docsonly-guard -- scripts
      #   .github` = 0 命中），属「机制建成未接线」。
      # 🔴 为什么是独立 step 而**不是** canary `for t` 清单项（实测）：
      #   夹具的 HARD 判据是 `[ "${SYNO_CI:-}" = "1" ]`，而本 job **没有 SYNO_CI** ⇒ 作为清单项
      #   由循环里那句 `bash "$t"` 跑它时恒为 SOFT ⇒ **永不为红 = 纸老虎**（判据②「改坏即红」
      #   在 CI 层不可能成立）。⇒ 本 step 显式给 `SYNO_CI: "1"` 才是真门禁。
      #   同因: pre-commit 默认亦无 SYNO_CI（D515「本地软提示 + CI 权威」）⇒ 接 pre-commit 同样
      #   拿不到 HARD，唯一落点就是本处。
      # 单一真值源（CTO 注意③）: 夹具自行从 ci.yml `grep -oE` 提取白名单正则；本 step **不传**
      #   任何正则、不设 `SYNO_CI_YML`（保持默认被测文件）⇒ 夹具判别力不被外部注入削弱。
      # 递归风险 = 0（CTO 注意①）: 实测该夹具外部依赖 python3/node/curl/git 调用 = 0，只读 ci.yml
      #   文本 + `grep -qvE` 判行为，**不调用任何门禁/CI 脚本** ⇒ 不构成「CI 的 CI」递归。
      # 三态（CTO 注意②）: 0 = 11 断言全 PASS ｜ 1 = HARD 下有 FAIL（有人把 .gitattributes 或
      #   .gitmodules 加回白名单等）⇒ step 红 ⇒ 必需 context 红（有意）｜ 2 = 被测 ci.yml 缺失
      #   （调用错误）⇒ 同样红，**绝不静默当 PASS**。无 `|| true` / 无 `continue-on-error`。
      # 位置: 置于重活之前 = fail-fast（实测耗时 0.047s，避免白烧 13/60min 重活）。
      - name: D1023 docs-only whitelist guard (L-WIRE, HARD)
        shell: bash   # Windows 上默认 pwsh ⇒ 必须显式 bash（夹具是 bash 语法）
        env:
          SYNO_CI: "1"   # 契约: 1 = HARD（任一 FAIL ⇒ exit 1）
        run: bash docs/synova/product-lines/evidence/D1023-861-docsonly-guard.sh
      - name: Run hermetic control-tower gate tests
        # T3: step 级 timeout（ubuntu 取 13，须 < 其 job 级 14）。
        #   D1147: 原 `${{ matrix.os == 'windows-latest' && 60 || 13 }}` 的 windows 分支随矩阵
        #   收敛为单元素而死代码 → 收敛为字面量 13（windows 侧 60min 值迁至顾问 job）。
        #   ⚠️ D1109 实测（2026-10-02，**windows**）：该 step 当时现值 60min < 同口径公式值 96min
        #   （n=10 重活样本：中位数 1910s / P95 2393s）—— 正是 run 36520361276 被 60min 砍死的原因。
        #   #939 已把实测值降到 739s；按口径须待 n=12「D1109 后」重活样本再重取（现 n=1）。
        timeout-minutes: 13
        # D1039 判据: 安全网③ schedule ⇒ 无条件跑；安全网② workflow_dispatch ⇒ 无条件跑
        #   （**人工触发永不导致"不跑"**：dispatch on main 时 `git diff origin/main...HEAD` 可为空
        #     ⇒ 判据会得出 run=false，故此处直接强制，不依赖判据）；其余事件 ⇒ 非 docs-only 且
        #   （判据命中 ctsignal.run=true 或 显式勾选 inputs.force_control_tower_tests）。
        #   本 job 无 job 级 if:/paths:（必需 context 必报）—— 重活门只在这一 step。
        #   表达式语义: `&&` 优先于 `||` ⇒ schedule || dispatch || (非docs-only && (命中 || 强制))。
        if: >-
          github.event_name == 'schedule'
          || github.event_name == 'workflow_dispatch'
          || (steps.docsonly.outputs.docs_only != 'true'
          && (steps.ctsignal.outputs.run == 'true' || inputs.force_control_tower_tests == true))
        shell: bash
        # 密封测试扩容（D520）：原 5 个（U2/U4/U5a/U5c/U7）+ D515/D520 新增的
        # mktemp/注入缝密封测试。其余测试依赖 git 历史/运行时数据，非密封，
        # 全量密封化是单独立项（K3 P2-4）。此 job 是"门禁坏了能抓到"的 canary。
        # D560（D549 重做，K3 FAIL 闭合）：补 P1-3 点名的 6 个密封测试入列（19→25）——
        #   D540-D547 批产出（K3 报告 2026-08-28-D540-D547 §2 P1-3 具名）；D549 声称入列
        #   实为零代码提交（M2），本批真实落地；6 测试本地全绿后入列。
        # D1039 登记（**占位登记，不执行**）: tests/win/vitest-log-level.test.sh — D1040(A4-b) 的配对测试。
        #   ⚠️ 本行**逐字说明它不执行**（诚实登记，不是"注释=假绿"）：真执行由 D1040 落 main 后另立卡负责。
        #   ① 该文件尚未在本树/main（只在 team/a4b-vitest-log）⇒ 若放进上面 for 清单，循环里那句
        #      `bash "$t"` 会真去执行它 ⇒ **EXIT=127** ⇒ FAIL=1 ⇒ 本 job 红 ⇒ 两必需 context 红；
        #   ② 该测试要 `npx vitest run`，而本 job **无 npm ci**/无 node_modules ⇒ 即使文件到位也不可能过；
        #   ③ 本行仅为满足 Gate Integrity 密封面 ratchet —— check-gate-integrity.sh:618 的 matcher
        #      扫 ci.yml **全文**（`for t in` 或任意 `run:` 步骤均计登记），故注释形即计登记；
        #      **真执行**落点 = 有 npm 依赖的 job（quality/test），不在此处。
        #   幽灵副作用（已知并接受）: 在文件尚未落 main 的树上，check-canary-drift.sh 会报一条
        #      **自愈** ::warning（A4-b 落 main 后消失；该脚本恒 exit 0 ⇒ 不阻断）。
        #   该用例自身含时序守卫（无修复的分支 ⇒ SKIP），断言 vitest.config.ts 收敛 LOG_LEVEL=warn。
        run: |
          FAIL=0
          # ── D-F/②（卡 #1227）: 执行集 = **发现制**，不再逐条登记 ──────────────────
          #   发现面（tests/control-tower、tests/doc-system）由
          #   scripts/control-tower/sealed-tests.sh 唯一声明；执行集 = 面扫描 − 隔离台账
          #   （gate-integrity-baseline.txt 的 REGISTRY-BASELINE 段）。
          #   ⇒ 面内新增测试**零登记自动纳入执行**；要排除必须写进隔离台账（留痕 + 双棘轮:
          #      FACE-TOTAL 下界 / QUARANTINE-TOTAL 上界）。
          #   rc≠0 = 发现制自身违规（面为空 / 疑似删测试 / 台账失效）⇒ fail-closed 判红，绝不静默跳过。
          # D1227（卡 #1300）越线者付账: 把 base 交给注入缝（纯 tree 计数，同一运行内测 scan(base) 与 scan(PR)）。
          #   PR 事件 ⇒ origin/<base>；merge_group/push 无 PR base ⇒ 空 ⇒ 脚本**显式打印「未给 base ⇒ 不判越线」**
          #   并退化为现状语义（禁静默）。origin/main 不可解析时脚本同样显式说明（见 sealed-tests.sh 判定点）。
          SEALED_BASE="${GITHUB_BASE_REF:+origin/$GITHUB_BASE_REF}"
          [ -n "$SEALED_BASE" ] || SEALED_BASE="${SYNO_BASE_REF:-origin/main}"
          export SYNO_BASE_REF="$SEALED_BASE"
          SEALED_LIST="$(bash scripts/control-tower/sealed-tests.sh --list)" || {
            echo "::error title=sealed-tests::发现制清单取数失败（原因见上）—— fail-closed，不静默跳过"
            exit 1
          }
          # ── SEALED-MANIFEST-BEGIN （生成物: bash scripts/control-tower/sealed-tests.sh --list）──
          #   用途: ① 兼容「接线 = 路径出现在 ci.yml 全文」类既有夹具（逐个 grep 自己的路径）；
          #        ② 人读清单。**执行集不取自本块**（取自上面的发现制取数）⇒ 本块过期不影响判定。
          #   漂移策略: **只对『块内有、执行集无』（陈旧方向）告警**；新增测试方向**不告警**——
          #        否则每个加测试的 PR 都要手改本生成物（= 变相登记制）。重生成命令见卡 note。
          # tests/control-tower/alloc-task-id-lock.test.sh
          # tests/control-tower/alloc-task-id-timeout.test.sh
          # tests/control-tower/alloc-task-id.test.sh
          # tests/control-tower/brief-parser-strip.test.sh
