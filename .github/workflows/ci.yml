name: CI �� SynovaAgent

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: TypeScript + Lint + Iron Laws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # D515 项7: 纯文档 PR 的 CI 瘦身 — 全部变更为 md/json/task-state/.claude 时
      # 跳过 TS+Iron Laws 重检查（只跳 job 内步骤，不跳 job——PR 状态仍可读）。
      # Secrets 由独立 job 扫描，不受影响。混合 PR 正常全量。
      # 注: main push 合并后 diff 为空 → 按纯文档跳过（PR 门已验证，避免空跑）。
      - name: Detect docs-only change (D515)
        id: docsonly
        run: |
          if git diff --name-only origin/main...HEAD | grep -qvE '\.(md|json)$|task-state/|\.claude/'; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
        if: steps.docsonly.outputs.docs_only != 'true'
      - run: npm ci
        if: steps.docsonly.outputs.docs_only != 'true'
      # D703 (K3 W-1) 证据命令机器化: 非 docs-only PR 改动 dev-doc → 按文件名 D 号
      # 回放对应 scripts/ci/verify-dXXX.sh 自证脚本（DS 命令从文档字符串升级为 CI 实跑）。
      # 缺对应脚本 → ::warning 显式 skip（不静默，倒逼各卡交付自证脚本）。
      - name: Replay changed dev-doc evidence commands (D703)
        if: steps.docsonly.outputs.docs_only != 'true'
        run: |
          CHANGED_DOCS=$(git diff --name-only origin/main...HEAD -- 'docs/plans/codex/implementation/SYNOVA-IMPL-*.md' || true)
          if [ -z "$CHANGED_DOCS" ]; then
            echo "skip: 本次未改动 dev-doc（docs/plans/codex/implementation/）"
            exit 0
          fi
          FAIL=0
          for doc in $CHANGED_DOCS; do
            DNUM=$(basename "$doc" | grep -oE 'D[0-9]+' | head -1 || true)
            if [ -z "$DNUM" ]; then
              echo "::warning title=verify-doc skip::$(basename "$doc") 文件名无 D 号，无法定位 verify-dXXX.sh（跳过）"
              continue
            fi
            # spec 文件名 D 号为大写（D703），自证脚本仓库惯例为小写（verify-d703.sh）——
            # 不转小写则 ubuntu 大小写敏感恒 warning skip（CI 首轮实证）
            DLOW=$(printf '%s' "$DNUM" | tr 'A-Z' 'a-z')
            SCRIPT="scripts/ci/verify-${DLOW}.sh"
            if [ ! -f "$SCRIPT" ]; then
              echo "::warning title=verify-doc skip::${SCRIPT} 不存在——$(basename "$doc") 的 DS 命令未接入 CI 回放（该卡应交付自证脚本）"
              continue
            fi
            echo "── $SCRIPT ← $doc"
            if ! bash "$SCRIPT" > /tmp/verify-doc-replay.log 2>&1; then
              echo "FAIL: $SCRIPT"
              # tail -60 而非 -20: 回放输出约 45 行（19×3 spec skip + D# 段 + 汇总），
              # -20 会把 [FAIL] 行截掉只剩 skip 尾巴（首轮实证无法定位失败 DS）
              cat /tmp/verify-doc-replay.log
              echo "::error title=verify-doc replay::${SCRIPT} 回放失败（$doc）"
              FAIL=1
            fi
          done
          exit $FAIL
      - name: TypeScript check
        if: steps.docsonly.outputs.docs_only != 'true'
        # K3 审计 P1-1 修复：去掉 `|| true` fail-open（CI 类型检查永不红 → 挪 CI 后类型防线真空）。
        # 过滤存量白名单（_extinct 退役哨兵死代码 + ima.ts/server.ts 已知错误 + 4 个历史文件），
        # 其余新类型错误 → exit 1 阻断。存量清理后逐步收紧白名单。
        run: |
          ERRORS=$(npx tsc --noEmit --pretty false 2>&1 | grep -v "_extinct/\|ima.ts\|server.ts\|sentinel-service.ts\|industry-loader.ts\|tool-registration.ts\|llm-provider-loader.ts" | grep -E "error TS" || true)
          if [ -n "$ERRORS" ]; then
            echo "$ERRORS"
            exit 1
          fi
      - name: Iron laws check
        if: steps.docsonly.outputs.docs_only != 'true'
        run: bash scripts/pre-commit-check.sh
        env:
          SYNO_DIFF_BASE: "origin/main"
          SYNO_CI: "1"  # D516/K3 P0-1: CI strict——本地 V5 软提示在 CI 转硬（权威物理落地）
      # D540: verify-parallel 已从本地 pre-push 移 CI/PR —— CI 权威物理拦截写集重叠
      #   base..HEAD write set vs origin/main 已合 dev doc write set（fetch-depth:0 需完整历史，已确认）
      #   纯文档 PR 跳过；混合 PR 正常跑。
      - name: Verify parallel declaration (D540, moved from local pre-push)
        if: steps.docsonly.outputs.docs_only != 'true'
        run: |
          # base..head 写集 × 已合 PR 写集 —— CI 权威物理拦截写集重叠
          bash scripts/control-tower/verify-parallel.sh --ci-pr origin/main
      # D708: 合并级写集对账 gate —— 本 PR 变更集 × **本 PR 自己的声明**（intra-PR 夹带）。
      #   与上一 step（verify-parallel: 本 PR × 已合 PR 写集，inter-PR 重叠）**正交**，不重复造。
      #   触发点 = 合并前（PR job）：出现夹带即红并逐文件点名；main/master push 自动跳过。
      - name: Merge write-set reconciliation (D708)
        if: steps.docsonly.outputs.docs_only != 'true'
        run: |
          python3 scripts/control-tower/merge_writeset_gate.py \
            --base origin/main --head HEAD --branch "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"

  test:
    name: Vitest (${{ matrix.shard }})
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1/2, 2/2]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Run tests
        env:
          NO_COLOR: "1"
        run: |
          # D721: 变更集必须以 **与 main 的合并基点** 为基准（三点差）。
          #   旧判据 HEAD~1..HEAD 在合并提交（刷新分支时 git merge origin/main）上会把「被并入的 main 全部改动」
          #   算作本 PR 改动 → 存量红被误判为新增红 → PR 永红（#513 实证：head 与 main 内容 git diff 为 0 却判 3 个新增失败）。
          BASE=$(git merge-base refs/remotes/origin/main HEAD 2>/dev/null || git merge-base origin/main HEAD 2>/dev/null || echo "")
          if [ -n "$BASE" ]; then
            CHANGED=$(git diff --name-only "$BASE"..HEAD 2>/dev/null || echo "")
            echo "变更集基准: merge-base(origin/main, HEAD)=$BASE（三点差：仅本 PR 引入的改动）"
          else
            CHANGED=$(git diff --name-only HEAD~1..HEAD 2>/dev/null || git diff --name-only origin/main..HEAD 2>/dev/null || echo "")
            echo "::warning::origin/main 不可用，回退 HEAD~1..HEAD 判据（合并提交下会误判存量失败为新增）"
          fi
          OUTPUT=$(npx vitest run --shard=${{ matrix.shard }} --reporter=verbose 2>&1; echo "EXIT:$?")
          echo "$OUTPUT"
          EXIT_CODE=$(echo "$OUTPUT" | grep "EXIT:" | sed 's/.*EXIT://')
          if [ "$EXIT_CODE" = "0" ]; then exit 0; fi
          # 去除 ANSI 颜色码后提取失败文件列表
          CLEAN_OUTPUT=$(echo "$OUTPUT" | sed 's/\x1b\[[0-9;]*[a-zA-Z]//g')
          FAILED_TESTS=$(echo "$CLEAN_OUTPUT" | grep " FAIL " | grep -oP 'tests/\S+\.test\.ts' || true)
          if [ -n "$FAILED_TESTS" ] && [ -n "$CHANGED" ]; then
            NEW_FAILURES=""
            while IFS= read -r tf; do
              SOURCE_FILE=$(echo "$tf" | sed 's|^tests/|src/|; s|\.test\.ts|.ts|' | sed 's|-sentinel||' || true)
              if echo "$CHANGED" | grep -qF "$SOURCE_FILE" 2>/dev/null || echo "$CHANGED" | grep -qF "$tf" 2>/dev/null; then
                NEW_FAILURES="${NEW_FAILURES}${tf}\n"
              fi
            done <<< "$FAILED_TESTS"
            if [ -z "$NEW_FAILURES" ]; then
              # D721: 放行必须可见（铁律 11 静默降级禁止）。存量红是**真红**，不是噪音——
              #   实测 main 021897a0 的 Vitest 就是靠这条放行的（3 failed / 286 passed 而作业 success）。
              echo "::warning::Vitest 存量红放行（非本 PR 改动文件引入，main 上同样红）: $(echo "$FAILED_TESTS" | tr '\n' ' ')"
              echo "PREEXISTING_RED_FILES:"
              echo "$FAILED_TESTS"
              echo "→ 这些是真红，已登记 board-backlog: PLAN-main-vitest-preexisting-red（须烧掉，勿长期依赖放行）"
              exit 0
            fi
            echo "本 PR 引进的测试失败（阻断）:"
            echo -e "$NEW_FAILURES"
          fi
          exit 1

  architecture:
    name: Architecture Check
    runs-on: ubuntu-latest
    env:
      SYNO_CI: "1"  # CT-64: 与 TypeScript job 对齐——check-architecture.sh 在 CI 也走严格模式（棘轮基线内不阻断，新增才阻断）
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Layer boundary check
        run: bash scripts/check-architecture.sh
      - name: GraphStore compatibility
        run: npx vitest run tests/architecture/

  test-kit-architecture:
    name: Test-Kit Architecture Tests (${{ matrix.os }})
    # D565 (K3 D489 批 P1, M3 家族): packages/test-kit 是独立 package（自带 lock，
    # 不在 root workspaces）——root Vitest/Architecture job 结构性覆盖不到它，
    # 棘轮基线（05-as-any-audit, as never 基线）此前只在本地执行。双平台接线闭环。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - name: Install test-kit deps
        working-directory: packages/test-kit
        run: npm ci
      - name: Run ratchet baseline test (05-as-any-audit)
        working-directory: packages/test-kit
        run: npx vitest run tests/architecture/05-as-any-audit.test.ts
      # D565 登记: architecture 套件余 4 文件（01/02/04）存量红（wiring-audit 引用已
      # 拆接线、>1000 行文件、l4 import）——从未入 CI 故腐化未察。修复归编码线
      # （CT-51 队列），修复一个入列一个；全绿后本 job 收敛为跑全目录。

  control-tower-tests:
    name: Control Tower Gate Tests (${{ matrix.os }})
    # D520/任务2: 双平台矩阵——平台问题（CRLF/python3/路径）不再等 Win 实测暴露。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # D520: verify-parallel 豁免逻辑依赖 origin/main ref（depth=1 时缺失→误红）
      - name: Run hermetic control-tower gate tests
        shell: bash
        # 密封测试扩容（D520）：原 5 个（U2/U4/U5a/U5c/U7）+ D515/D520 新增的
        # mktemp/注入缝密封测试。其余测试依赖 git 历史/运行时数据，非密封，
        # 全量密封化是单独立项（K3 P2-4）。此 job 是"门禁坏了能抓到"的 canary。
        # D560（D549 重做，K3 FAIL 闭合）：补 P1-3 点名的 6 个密封测试入列（19→25）——
        #   D540-D547 批产出（K3 报告 2026-08-28-D540-D547 §2 P1-3 具名）；D549 声称入列
        #   实为零代码提交（M2），本批真实落地；6 测试本地全绿后入列。
        run: |
          FAIL=0
          for t in \
            tests/control-tower/verify-parallel.test.sh \
            tests/control-tower/verify-claims-table.test.sh \
            tests/control-tower/write-set-check.test.sh \
            tests/control-tower/post-commit-marker.test.sh \
            tests/control-tower/ct-test-gate.test.sh \
            tests/control-tower/task-start-parallel.test.sh \
            tests/control-tower/fastlane-bypass-only.test.sh \
            tests/control-tower/gate-stats.test.sh \
            tests/control-tower/q2-error-locating.test.sh \
            tests/control-tower/platform-checklist.test.sh \
            tests/control-tower/tag-ancestry.test.sh \
            tests/control-tower/brief-parser-strip.test.sh \
            tests/control-tower/post-commit.test.sh \
            tests/control-tower/simulate-ci.test.sh \
            tests/control-tower/synova-submit.test.sh \
            tests/control-tower/synova-commit.test.sh \
            tests/control-tower/parallel-main-tree-occupancy.test.sh \
            tests/control-tower/fastlane-extended.test.sh \
            tests/control-tower/g12-day-window.test.sh \
            tests/control-tower/incident-loop.test.sh \
            tests/control-tower/check-canary-drift.test.sh \
            tests/control-tower/claim-regex-narrow.test.sh \
            tests/control-tower/ci-strict-visible.test.sh \
            tests/control-tower/skeleton-brief-gate.test.sh \
            tests/control-tower/clone-config-init.test.sh \
            tests/control-tower/clone-shadow-commit.test.sh \
            tests/control-tower/verify-parallel-ci.test.sh \
            tests/control-tower/alloc-task-id.test.sh \
            tests/control-tower/alloc-task-id-lock.test.sh \
            tests/control-tower/check-gitlinks.test.sh \
            tests/control-tower/grep-oP-regression.test.sh \
            tests/control-tower/merge_writeset_gate.test.sh \
            tests/control-tower/ci-ratchet-base.test.sh \
            tests/control-tower/verify-doc.test.sh \
            tests/doc-system/check-doc-truth.test.sh \
            tests/doc-system/doc-registry-gate.test.sh \
            tests/doc-system/doc-categories.test.sh \
            tests/doc-system/doc-staleness.test.sh \
            tests/doc-system/doc-triage.test.sh \
            tests/doc-system/generate-chronicle-monthly.test.sh \
            tests/control-tower/check-citations.test.sh \
            tests/control-tower/check-progress-freshness.test.sh \
            tests/control-tower/check-subprocess-protocol.test.sh \
            tests/control-tower/check-deps-injection.test.sh; do
            echo "── $t"
            # D526: 测试失败输出进 ::error 注解——无 token 也能经 annotations 定位（D521 工具1 语义）
            if ! bash "$t" > /tmp/ct-out.log 2>&1; then
              echo "FAIL: $t"
              MSG=$(tail -8 /tmp/ct-out.log | tr '\n' '|' | tr -d '%' | cut -c1-450)
              echo "::error title=$t::$MSG"
              FAIL=1
            fi
          done
          # D526: canary 密封清单漂移告警（::warning 可见，不阻断——防误伤；
          #   存量漂移由 K3/人工月度清理，全量密封化是 K3 P2-4 单独立项）
          bash scripts/control-tower/check-canary-drift.sh || true
          exit $FAIL

  integration-check:
    name: Integration Contract Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: L1+L2 integration checks
        run: bash scripts/workflow/check-integration.sh

  checker-review:
    name: Checker Review (maker/checker)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feat/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - name: Run checker review
        run: bash scripts/checker-review.sh
      - name: Brief vs Code consistency
        run: bash scripts/workflow/check-brief-vs-code.sh --strict || true

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    # 2026-08-16 创始人裁决豁免（台账登记）：33 漏洞（32 high/1 critical）在 node-gyp
    # 编译链，非产品运行时；Synova 本地部署，攻击面不成立。豁免登记备案，
    # 触发升级条件 = 上云/公网化。CI 保留扫描（黄灯），失败不阻断合并。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --audit-level=high || echo "npm audit 已豁免 (2026-08-16 创始人裁决, 见台账)"

  golden-case:
    name: Golden Case F1 Gate
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - name: Run golden case F1 gate
        run: npx tsx scripts/ci/golden-case-checker.ts
      - name: Run diagnosis quality check
        run: bash scripts/ci/diagnosis-quality-check.sh
