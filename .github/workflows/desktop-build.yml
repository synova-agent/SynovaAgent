# D517: 桌面端安装包 CI 构建（验证点 1-1——安装包产出可复现，任何人可下载验证）
# 契约: push main / workflow_dispatch 触发；按 build-synova.cjs 头注释构建链三步顺序执行；
#       各平台原生构建（不做 linux 交叉）；CI 无 GUI → 只构建不启动（启动实测归 D519 本机）；
#       产物缺失 → 步骤 fail（exit 非 0 即红）。
# D529: ①所有含 bash 语法（test/compgen）的步骤显式 shell: bash——Windows runner 默认 pwsh，
#         `test -f` 在 pwsh 是 CommandNotFound 必红（PR #175 只修了 distutils 没修这个）。
#       ②fix/d529-* 分支也触发（修复迭代期拿新鲜日志——旧日志 BlobNotFound）。
#       ③失败时错误尾部走双通道回传：REST API commit 到 ci-debug/ + ::error:: 注解
#         （check-runs 注解 API 公开可读——本地无 gh/token 的 session 不猜根因）。
name: desktop-build

on:
  push:
    branches: [main, 'fix/d529-**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos (dmg + zip)
            os: macos-latest
            builder-args: '--mac'
          - name: windows (nsis)
            os: windows-latest
            builder-args: '--win'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # D529: node 20 (ABI 115) 无 better-sqlite3 v12 预编译（只发 ABI 127+）→ 回退 node-gyp
          # 源码编译 → runner VS 18 与 node-gyp 9.4.1 不兼容必红。node 22 = ABI 127 ✓ 预编译直达。
          node-version: 22

      # node-gyp 9.4.1 编译 better-sqlite3 需要 stdlib distutils（实证：Python 3.12.10 也已无 distutils，仅 3.11 及更早原生含 → 固定 3.11）
      - name: Setup Python 3.11 (node-gyp distutils compat)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 构建链步骤1: 后端单文件 bundle → dist/backend.mjs（prod 入口；tsc 独立门禁不在打包链）
      - name: Build backend (esbuild bundle)
        shell: bash
        run: |
          set -o pipefail
          { bash scripts/control-tower/install-deps.sh && npm run build:backend && test -f dist/backend.mjs; } 2>&1 | tee step-backend.log
          test ${PIPESTATUS[0]} -eq 0

      # 构建链步骤2: renderer vite → dist/renderer（首诊 UI）
      - name: Build renderer (vite)
        shell: bash
        working-directory: electron-renderer
        run: |
          set -o pipefail
          { bash "$GITHUB_WORKSPACE/scripts/control-tower/install-deps.sh" --prefix . && npm run build && test -f ../dist/renderer/index.html; } 2>&1 | tee ../step-renderer.log
          test ${PIPESTATUS[0]} -eq 0

      # 构建链步骤3a: 原生依赖准备（D529 定案 v3——彻底不用 @electron/rebuild）:
      #   ① bcrypt 6.0.0 是 N-API（prebuildify --napi, install=node-gyp-build）——ABI 无关，免重建；
      #      之前 @electron/rebuild 误判为 node-gyp 模块源码编译 → 双平台挂死。
      #   ② @electron/rebuild 的依赖树搜索在 CI（node 22）卡死（10min+ 无输出，swap 嵌套 node-gyp
      #      依旧）——弃用，改 prebuild-install 直下（无树遍历）。
      #   ③ better-sqlite3 v12.11.1 有 electron-v130（Electron 33.4.11）全平台预编译 → 直下免编译
      #      免 VS（windows-latest 已切 VS2026，旧 node-gyp 无法识别）。
      #   ④ 兜底: 预编译下载失败 → node-gyp@12 源码编译（VS2026 兼容，nodejs/node-gyp#3228）。
      - name: Prep native deps (better-sqlite3 electron prebuild)
        timeout-minutes: 10
        shell: bash
        run: |
          set -o pipefail
          # 🔴 D1172 复核整改（S5）: 独立复核实测 —— `npm i --no-save <含 postinstall 的包>`
          #   在刚跑过 `npm ci --ignore-scripts` 的工程里**照样执行其 postinstall** ⇒ 这是**默认拒的绕过路径**。
          #   ⇒ 必须显式 `--ignore-scripts`（node-gyp 无需安装期脚本；它自己就是构建器）。
          npm i --no-save --ignore-scripts node-gyp@12 2>&1 | tee step-prep-nodegyp.log
          test ${PIPESTATUS[0]} -eq 0
          if ! (cd node_modules/better-sqlite3 && npx prebuild-install -r electron -t 33.4.11 2>&1 | tee ../step-prep-rebuild.log; test ${PIPESTATUS[0]} -eq 0); then
            echo "prebuild-install 失败 → node-gyp@12 源码编译兜底"
            (cd node_modules/better-sqlite3 && npx node-gyp rebuild --release 2>&1 | tee ../step-prep-rebuild.log; test ${PIPESTATUS[0]} -eq 0)
          fi
          ls node_modules/better-sqlite3/build/Release/*.node >/dev/null && echo "better-sqlite3 electron-ABI 就位"

      # 构建链步骤3b: electron-builder → release/（--publish never: CI 下无 GH_TOKEN 时发布检查必红，
      # 产物实际已构建——mac 实测 dmg/zip/blockmap 全部产出后才在发布检查翻红）
      - name: Build installer (electron-builder)
        timeout-minutes: 30
        shell: bash
        run: |
          set -o pipefail
          npx electron-builder --config build-synova.cjs ${{ matrix.builder-args }} --publish never 2>&1 | tee step-installer.log
          test ${PIPESTATUS[0]} -eq 0

      # D529 终态: 根因已定位修复（--publish never / node 22 / npmRebuild:false + prebuild-install），
      # debug 回传步骤移除（迭代期日志见 ci-debug/ 历史 + 本文件 git 历史注释）。

      - name: Assert artifacts exist
        shell: bash
        run: |
          ls -lh release/
          if [ "${{ runner.os }}" = "macOS" ]; then
            compgen -G "release/*.dmg" > /dev/null || { echo "::error::no dmg produced"; exit 1; }
            compgen -G "release/*-mac*.zip" > /dev/null || { echo "::error::no mac zip produced"; exit 1; }
          else
            compgen -G "release/*.exe" > /dev/null || { echo "::error::no exe produced"; exit 1; }
          fi

      # D713: 签名门禁（2026-09-13 创始人报告"打都打不开"）——产物"存在"≠"可用":
      #   dmg/zip 内 app 无 _CodeSignature 封印 → macOS 拒启。此处对**产物本身**做校验，
      #   未签名/封印破损 → 红（坏包不得随 artifact 出货）。先跑门禁自测，再校验产物。
      - name: Signature gate self-test (D713)
        if: runner.os == 'macOS'
        shell: bash
        run: bash tests/desktop/verify-package-signature.test.sh

      - name: Verify package signatures (D713)
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/desktop/verify-package-signature.sh --all --dir release

      - uses: actions/upload-artifact@v4
        with:
          name: synova-desktop-${{ runner.os }}-${{ github.run_number }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
