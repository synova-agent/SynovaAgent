# product-progress.yml — 产品进度自动刷新（设计 v1.4 §5.3 A1+A3+A4+A5）
#
# 触发:
#   - push 到 main（= PR 合并事件）→ A1 证据失效检测 + A4 进度重算（代码一变页面自动转黄）
#   - 每周五 09:00 UTC（17:00 北京时间）→ A3 待办聚合 + A4 + A5 全量刷新
#   - 手动 workflow_dispatch
#
# 产出: docs/synova/product-lines/{todos.yaml,product-progress.json,product-progress.html}
# D786 通道设计 (b，2026-09-16): 产物有变化 → 只提交 bot 分支 auto/product-progress（force push），
#   **不再开 PR**——GITHUB_TOKEN 创建的 PR 不触发任何 workflow，12 个必需检查永不报告 = 永久
#   blocked（#404 实证）。合并由 CTO session 用 PAT 显式开 PR + CI 全绿 + API 合并。
#   链路文档: docs/synova/coordination/CI-诊断通道.md；新鲜度兜底: progress-freshness-watchdog.yml。
#   无变化 → 什么都不做（幂等）。
#
# 红线: 本工作流只消费数据源 + 调用 scripts/product-lines/（Harness 代码，进审计范围）；
#       不触碰 scripts/audit/、不写审计标准。

name: Product Progress (A1-A5)

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    name: 聚合 → 计算 → 页面
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: bash scripts/control-tower/install-deps.sh
      - name: A2 机器验证入库（vitest 全绿 → ci 证据）
        run: |
          if npx vitest run > /tmp/vitest-a2.log 2>&1; then
            POINTS=$(python3 scripts/product-lines/list-test-points.py)
            if [ -n "$POINTS" ]; then
              python3 scripts/product-lines/evidence-writer.py \
                --type ci --verdict pass --points "$POINTS" \
                --source "CI vitest 全绿（product-progress workflow A2）"
            else
              echo "无 test 绑定验收点，跳过证据写入（正常）"
            fi
          else
            echo "vitest 未全绿（exit=$?），跳过证据写入——不写假绿证据（fail-closed）"
          fi
      - name: 一键刷新（A3+A4+A5，含 A1 惰性失效）
        run: bash scripts/product-lines/refresh-all.sh
      - name: 产物有变化则提交到 bot 分支（D786 通道设计 b：不开 PR）
        run: |
          git config user.name "synova-bot"
          git config user.email "bot@synova.local"
          if git diff --quiet -- docs/synova/product-lines/; then
            echo "无变化，跳过（幂等）"
            exit 0
          fi
          git checkout -b auto/product-progress
          git add docs/synova/product-lines/
          git commit -m "chore(D371): 产品进度自动更新 $(date -u +%Y-%m-%d)"
          git push origin auto/product-progress --force
          echo ""
          echo "📌 D786 通道设计 (b)：bot 分支已推——GITHUB_TOKEN 创建的 PR 不触发任何 workflow，"
          echo "   12 个必需检查永不报告 = 永久 blocked（#404 实证，2026-09-07~16）。"
          echo "   后续由 CTO session 显式完成（链路文档 docs/synova/coordination/CI-诊断通道.md）:"
          echo "   1) 用 PAT 从 auto/product-progress 开 PR（真实凭据 → 必需检查正常报告）"
          echo "   2) CI 全绿后 API squash 合并（合并是 CTO 的工作，D570）"
          echo "   产物新鲜度由 progress-freshness-watchdog.yml 每日看门狗兜底（>3 天红灯）。"
