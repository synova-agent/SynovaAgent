# ═══════════════════════════════════════════════════════════════════════════════
# ---- P4 2026-10-28：#1114 Step 0 —— run_by 全量建账（纯追加段；不改上方任何登记行）----
#
# 口径（创始人 2026-10-28 批准的 D1）：
#   run_by ∈ {pre-commit, gitea-ci, github-ci, npm, 无} ｜ quota ∈ {true, false}
#   · 赋值 = **逐字引用**四条腿源文本（去注释后）命中该件的 basename，优先级
#     pre-commit > gitea-ci > github-ci > npm；四腿皆不命中 ⇒ 无。
#     四腿源文本 = scripts/pre-commit-check.sh ／ .gitea/workflows/*.yml ／
#     .github/workflows/*.yml ／ package.json 的 scripts 段。
#   · quota: true 只给「被 pre-commit/CI 真实调用 ∧ 语义为拦错」的 check/verify ⇒ 本批 39 件；
#     probe 观测件／npm 人工工具件／库件／无主件 = false。配额上限（≤30）与超编清单属 Step 2 判据，
#     本段**只建账不封顶**（规格 §九：配额只数 quota:true）。
#   · run_by="无" 的件逐条镜像进下方 run_by_candidates 段 —— M-15：允许存在，但**不得静默留存**。
#
# 已知限制（禁读成"已全部在跑"）：
#   1. 只认四条腿的**直接引用**。由其他脚本/钩子间接调用的件记 无（候选段 why 已逐条点名：
#      check-bypass-log.sh 实际跑在 scripts/pre-push-check.sh；verify-incremental.sh 实际跑在
#      scripts/hooks/hook-enforce-loop.sh；hook-block-write.sh 挂在 .claude/settings.json）。
