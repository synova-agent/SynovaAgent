# 🔴 本批只落 3 行真实样例，不填全量（规格 §1.2 非目标）；行号已现场 `grep -n` 复核。
# 🔴 capability pattern 说明：规格 §2.3-D2 示例 pattern 为 ^[a-z]...（纯小写），但其自身样例
#    （content.initContentTypes / audit.verifyChain）含大写 ⇒ 本表按真实 capability 命名
#    用 [A-Za-z] 起始（规则 R4 本身不变；差异登记在 quality-baseline.py 的 limitations L8）。
