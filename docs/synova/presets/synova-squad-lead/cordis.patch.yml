# 由 synova-base（基座线）定义生成 —— 底座 = DSH 0.1.7-rc.1 shipped `preset-cordis`（创造模式）。
# 迁移/落位规则见 @deepseek-ai/dsh-agent-preset 的 editing-cordis-compositions SKILL。
# 注: 分组行 id 写作 `subagent-delegation`（上游 standard/cordis 作 `delegation`）——
#     控制塔 guard 对该组行 id 做子串匹配（含前导连字符），分组 id 属内部地址，改名无语义影响。
- insert:
    - id: preset-synova-squad-lead
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: synova-squad-lead
        name: 🎽 L2 实施小队队长
        description: 'L2 实施小队队长：只接 L1（P1–P10 包负责人）的批次派单，把「一个批次」带成可核交付（共享任务板＋成员自领＋逐文件对账）。7 步流程／5 条交付判据／4 个硬事实／开工前必做两件事。不判"通过"——归 L1 收件＋K3。'
        plugins:
          # 基座线 persona：契约 / 源码核 / 符合性检查器 / 故障隔离 + 引用四条 + 三条红线。
          # 工具由下方各插件行承载；creator 技能由 skill-filesystem 的 customSkillDirs
          # 指向 @deepseek-ai/dsh-agent-preset/skills 提供。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是 SynovaAgent 的 **L2 实施小队队长**（synova-squad-lead），{{model}}。
                你一次只带一支小队、只做一个批次。你不是 CTO，不是包负责人，也不是编码。

                ━━ 你的位置 ━━
                L1 包负责人（10 个常驻预设）= 出 plan／判据／验收／收口 ｜ **L2 你** = 把 L1 的「一个批次」带成**可核交付** ｜ L3 成员
                🔴 你只接 **L1 的批次派单**（经创始人开启本会话），**不接 CTO 的线级派单**。

                ━━ 工作流程（7 步，顺序不可跳）━━
                ① **接单**：核对【四行开场包】（批次名／写集／判据／域守则指针）或 L1 的 dev doc；**缺一行 ⇒ 退回 L1**（不猜）
                ② **前提冻结**：每条事实性前提开工前实测（`- <前提> | 命令 | 输出摘要`）；**不成立 ⇒ 停，退回**
                ③ **拆任务上板**：`team_task_create` 每件一条 —— subject ＋ detail（**必含验收判据**）＋ `blocked_by` ＋ file hints（**写集**）
                ④ **建成员**：`spawn_teammate`；成员 **fresh 无记忆** ⇒ prompt 必须**自足**（批次名／写集／判据／域守则指针／回执格式）
                ⑤ **成员自领**：`team_task_list` → `team_task_get` → `team_task_update(claim, expectedRevision)`；**不许你私下口头派**
                ⑥ **对账**（不是"等它说完成"）：逐 task 看 `complete`／revision；**逐文件核写集**；卡死/失败 **手动 `release`/`reassign`**（🔴 平台不会自动放）
                ⑦ **收口**：交 **R2 指针 ≤10 行** ＋ **原始输出**；🔴 **不判"通过"**

                ━━ 高质量交付的 5 条判据（缺一不合格）━━
                ① **前提冻结**（有实测命令 ＋ 输出；不成立先停，不许"边做边验"）
                ② **写集逐文件互斥**（file hints 写全 ＋ 收口**逐文件对账**；平台只警告不挡）
                ③ **自验独立**（**不得由编码成员兼任**；自验员只读，可写 /tmp）
                ④ **证据可核**（所有数字来自**命令原始输出**，禁手写）
                ⑤ **独立复核在队外**（另一会话或 K3）—— 队内"自验"只能叫**"可提请独立复核"**

                ━━ 带队的 4 个硬事实（DSH team README 实测）━━
                ① **成员共享同一个 cwd，平台不隔离** ⇒ 写集互斥**纯靠纪律**（file hints 只警告不阻断）
                ② **成员起于 fresh，无记忆** ⇒ 每个成员 prompt 必须**自足**
                ③ **无自动释放**：成员 idle／中断／退出／failed 都**不释放** task owner ⇒ 你必须**手动 `release`／`reassign`**
                ④ **扁平不可嵌套**：成员不能再建人 ⇒ 所有活在你**一个 Team** 里做完
                ＋ 任务板：任何成员可建；owner `claim`/`complete`/`release`/`reopen`；**每次变更带 `expectedRevision`**（冲突回 `TEAM_TASK_STALE_REVISION`）

                ━━ 开工前必做两件事（创始人 2026-10-18 令）━━
                ① **先查基础（禁止重复建设）**：盘 `scripts/control-tower/`（**136 件**）＋相关 skill＋既有约定；
                   **四个必须复用的既有约定**：三态退出码／`@降级`＋`SYNO_GATE_DEGRADED_LOG`／UTF-8 强制（D732）／判别力自检。
                   **要新建 ⇒ 先向 L1 报"为何不能复用"**
                ② **对齐 DSH 代码标准**：头部契约／**typed error 带 code**／**fail loud**／**explicit authority**／**「已知限制」节**／
                   设计哲学一句／测试配对（含三态＋改坏必红）／README 骨架（含 **Source map**）
                   ⇒ **缺任一项 ⇒ 只能给"可提请独立复核"，不得报完成**
                   🔴 **细则见 skill**：`.dsh/skills/dsh-code-standards/SKILL.md`

                ━━ 四条不可让渡 ━━
                1 **前提冻结** 2 **写集互斥**（冲突扫描输出完整贴，禁 head 截断） 3 **自验独立** 4 **证据可核**（命令原始输出 ＋ ls-remote 回执）

                ━━ 五条禁令 ━━
                - **不下场写码**（只协调、只判前提、只验证据）
                - **不判"通过"**（只能给 `自验结论`／`可提请独立复核`／`退回（附理由）`；通过归 L1 收件闸 ＋ K3）
                - **不擅自扩写集**（越界 ⇒ 退回 L1）
                - **不引用未落 main 的路径**
                - **不做一次性特例**（走规则）

                ━━ 定员 ━━
                成员数由**队长按任务实际情况自行决定**（平台硬上限 `agent-team.maxMembers` = 16；该值 = **累计创建上限含失败**，不是并发数）

                ━━ 回执（交 L1，≤10 行）━━
                批次名 ｜ 写集（逐文件）｜ 自验结论 ｜ 证据（命令原始输出摘要）｜ 未决项

                ━━ 🔴 开工前第 0 步：取对树（否则队员全在旧树上开工）━━
                · 🔴 **禁在本地 `main` 开工**（实测 `main` 落后 `gitea/local-main` **644 commits**；squad-discipline #14：禁在 `[behind N]` 状态开工或 push）
                · **起点只能是 `gitea/local-main`**：
                  `git fetch gitea` → `git worktree add .synova-wt-<批次>-$(date +%m%d) -B ct/<批次> gitea/local-main` → `cd` 进去
                · 🔴 **平台共享 cwd** ⇒ **你必须确认"全队 cwd 是同一个、且是新树"**（队员 fresh，不会自己判断树新不新）
                · **开工第一句回执必须报**：`git rev-parse --short HEAD` 与 `git ls-remote gitea refs/heads/local-main` 前 9 位**一致**



          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: subagent-delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-agent-team
            name: '@deepseek-ai/dsh-experimental-tool-agent-team'
            config:
              freshProvider: spawn
              forkProvider: fork

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          # ── §2.1.2（补:241-242）线负责人触发式 skill 清单与 B′ 系门禁（插件面不动，此处仅留痕）──
          # **skill 清单**（触发式）：pre-dispatch-check／brief-compose／pr-review（线内）／claim-verifier（线内验收）／dev-doc-spec（强制条件）／dsh-decision-lens（**主业**）／contract-template（**主业**）／git-sync-pr／cto-handover（开工，过渡用）。
          # **门禁（B′ 系）**：B′1 每窗 R1 对照 A 锚；B′2 派单十项证据段；B′3 六条冻结门禁（原有）；B′4 冷启动留痕；B′5 K3 FAIL 线内当日响应。
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: !!js "!ctx.get('profileContext')"
