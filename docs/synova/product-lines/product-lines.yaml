# product-lines.yaml — 产品完成度单一事实源（v1）
#
# 用途: 把"产品 = N 条能力线"写死。每条线到 100% 的定义 = 验收点清单。
#       进度条 = 被证据验证的验收点比例（由 scripts/product-lines/calc-progress.py 计算）。
# 维护: 线集 = 产品定义，只有创始人能改（增/删/拆/并）。验收点细节由 DeepSeek Harness 起草。
# 锁定: 2026-08-16 创始人确认（PHASE0-LINE-REVIEW v3，26 条线 + 1 条 v2 扩展线）。
# 诚实规则: 只有带证据的验收点才算"已验证"。agent 说"做了"不算；代码提交不算；D# 合并不算。
#           证据 = 可 grep、可重跑、可复核的物理事实（K3 报告 / 场景绿 / 测试绿 / 创始人演示核验）。
#
# ── V1 v0.2 元断言 M1–M5（判定规则，不计入分母）─────────────────────────────
# 单源: docs/synova/project/26线-V1验收标准-v0.2-20260917.md §〇（冻结件，创始人 2026-09-17 签字）
# 落点: 本文档（yaml 注释）｜冻结件 §〇｜《DSH借鉴指引-v2-20260904》§10/§11/§12（D808 附录 C 逐字核）
# 账目: docs/synova/project/26线-V1验收标准-草案v0.2-20260918.md（128 条 = v0.2 §三 变更单）
#
# M1（DSH 复用口径 · 全 26 线适用）
#   凡某验收点的能力与现行 DSH 已有能力重叠时，该点必须写成「接入/配置/约束 DSH 的 <能力> 并验证」，
#   不得写成「实现 <能力>」。判定：verify 须同时指向 ① DSH 侧配置/接入点 ② 本仓验证断言两段；
#   只写「实现 X」视为口径不合格，不计通过。
# M2（G3 物理化 · 借鉴卡必须回写台账）
#   每张 DSH 借鉴卡（B-01…B-20）必须回写到至少一个 26 线验收点，并生成绑定该点 id 的证据文件；
#   未回写、或无绑定证据者，该卡不计通过。
# M3（合规边界 · 创始人裁定）
#   抄代码 = 允许且鼓励；桥接引用 = 禁止（禁 import @deepseek-ai/*、禁 re-export 壳）；
#   抄写处必须留锚点注释（包 + 文件 + 符号）+ 现验命令（行号现查）。
# M4（借鉴发现机制 · 发现即登记）
#   任何 session 发现新的可借鉴能力（含 UI/前端组件、页面范式、交互形态）必须走三步：
#   ① 立借鉴卡 ② 回写对应线验收点 ③ 生成绑定证据。发现而不登记 = 漏账，计入审计 findings。
# M5（UI / 前端面复用口径）
#   凡 DSH 客户端已有的 UI 范式，界面元素一律「复用/对齐 + 验证」，禁止从零造组件。
#
# 字段说明:
#   id/name/value      — 线的基本定义（大白话，创始人可读）
#   weight             — 产品总进度权重（默认等权 1.0）
#   baseline_pct       — Phase 0 诚实粗估（±15%，由验收点验证后取代）
#   baseline_note      — 粗估的事实依据
#   modules            — 关联代码路径（git 变更 → 该线证据自动失效转黄，A1）
#                        归属规则（D808 §12）: R1 一个落点只归一条线；R3 必须是真实存在且 git pathspec
#                        可命中的路径（幻影路径 = 失效检查静默空转）；R5 混合目录按文件粒度归属，
#                        禁止整目录挂靠。
#   done_definition    — 100% 的完整定义
#   acceptance_points  — 验收点清单:
#     id               — 线号-序号
#     desc             — 一条可验证的"完成"定义（大白话）
#     evidence         — 证据绑定（scenario:GS-XX / k3:<报告> / test:<套件> / founder-demo:<记录>）
#                        ⚠️ 角色（D806 澄清）: 本字段是**文档性标注**（全仓实测零机器读取），说明「这条点打算用什么证据」；
#                        **证据 kind 的机器源 = `docs/synova/project/26线-V1验收标准-v0.2-20260917.md` 附录 A**
#                        （`gen-project-board.py` 按「证据」列 kind 与证据文件 record_type 配对计分 → ledger.json）；
#                        `calc-progress.py` 只看证据文件，不读本字段。改 kind 口径请改 V1 表 + 本字段同步。
#     status           — 六态: uncommitted / failed / pending_k3 / verified / rejected / stale
#                        （yaml 内为初始值；最终状态由 calc-progress.py 按证据重算）
#     note             — 为什么是这个状态（可追溯）

