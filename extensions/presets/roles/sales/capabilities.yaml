# sales/capabilities.yaml — 常用能力
roleId: sales
version: 1.0.0
capabilities:
  - id: capability.revenue-health
    label: 收入健康度
    tool: analysis.revenue-health
    enabled: true
  - id: capability.customer-growth
    label: 客户增长诊断
    tool: analysis.customer-growth
    enabled: true
  - id: capability.commission-edit
    label: 修改提成方案
    enabled: false
    disabledReason: 提成方案属制度层，须走人工审批（fail-closed）；岗位包不自动开通

# ═══ K12-11 (#194 / RB-03): 权限**项**（同 finance 的口径）═══
permissionGrants:
  grants:
    - knowledge.market.read
  denies:
    - knowledge.market.write
