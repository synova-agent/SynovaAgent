# tests/contract/known-divergences.yaml — KNOWN_VIOLATION 登记表（#913-PR-1 · 裁 331）
#
# 用途：登记「契约已判、上游未修」的违约 —— 照测并标红（stdout 打印 `KNOWN_VIOLATION: <id> × <impl>`），
#       exit 0 不阻断；但「未登记违约」与「登记未删而实测已绿（强制转正）」都判红。
# 纪律：**只减不增**（上游修好后必须删行，不得留登记）。
# 消费：tests/contract/storage-backend.conformance.test.ts（主测试）＋ meta.test.ts（结构校验）。
# 真源：.handbook/派单件/2026-10-24-规格-913-PR1-契约套件.md §1 件 6／§2（裁 331）。
# 字段说明：id＝登记身份名（规格 §1/§3.2 用名）；case＝对应契约用例 id（规格 §2 表用名），
#           二者一致时可省略 case；本批 keyPrefix-literal ↔ query-prefix 用 case 显式映射（规格两处命名双轨）。
# 修缺陷另立卡：P2（S）——本清单只记账，不在本批改 src/**。
schema_version: 1
meta:
  as_of: "gitea/local-main@138b8f2dc"
  ruling: "裁331"
  interface: StorageBackend
divergences:
  - id: updatedAt-iso
    implementation: SqliteStorageBackend
    owner: P2
    expiry: "2026-12-31"
    ruling: "裁331"
    evidence: "src/store/storage-backend.ts:135,159 用 datetime('now') 写 updated_at ⇒ 实测 \"2026-10-23 18:30:00\"（非 ISO 8601 UTC）；MemoryStorageBackend 用 toISOString() 合规"
  - id: keyPrefix-literal
    case: query-prefix
    implementation: SqliteStorageBackend
    owner: P2
    expiry: "2026-12-31"
    ruling: "裁331"
    evidence: "src/store/storage-backend.ts:189-192 query 用 key LIKE ? + '<prefix>%'，未转义 _/% ⇒ 实测 a_→[\"a_b\",\"axb\"]、p%→[\"p%q\",\"pxq\"]；MemoryStorageBackend 用 startsWith 合规"
